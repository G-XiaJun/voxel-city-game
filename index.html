        这些文件对现代住宅立面的要求高度一致，可以当作行业事实）：

          ① **三段式构图**是住宅立面的基本手法：
             "采用三段式建筑形式，根据建筑高度的不同，选择合适比例关系"。
             即 基座（近人尺度）+ 标准层段 + 顶部收头段。
          ② **基座必须用高质感材料**：
             "住宅基座部分及公服配套建筑应采用石材、陶板、金属板等
              富有质感的高品质建筑材料，提高近人尺度效果"。
             所以底部几层单独走"基座色"，与上部拉开。
          ③ **腰线要小巧精致**：
             "从严控制建筑立面腰线层构造的形态和尺寸，做到腰线尽量小巧、
              精致，减少对户内采光通风的影响"。
             → 腰线只占 1 格，绝不能做成粗大横带（那是最常见的外行做法）。
          ④ **窗套 / 窗台板要有凹凸**：
             "现代住宅设计最大的变化是设置窗台板，窗不再是一个平面，
              而是折线形的多个平面……外立面有凹凸变化，虚实对比"。
             → 窗的上沿/下沿各加一格线脚，让窗"镶"在墙里。
          ⑤ **空调机位是住宅立面的标志性构件**：
             "在放置空调机的凹槽使用水平方向或纵向的百叶装饰线条"、
             "空调位尽量考虑结合阳台、露台布置；尽量做到外墙凹进部位"。
             → 每户一个空调位，用"百叶"材质（这里是深色格）表示。
          ⑥ **阳台封闭化 + 玻璃栏板**：
             "住宅南立面阳台应进行封闭设计，设备平台外侧维护设施
              建议采用玻璃栏板"。
             → 阳台做成竖向成组的玻璃段。
          ⑦ **女儿墙要压顶出挑**：
             "女儿墙横向压顶线条高度 150mm，出挑 100mm，防止雨滴脏污墙面"。
             → 女儿墙顶那一格向外挑，顶部一格走浅色压顶。
          ⑧ **山墙（侧面）要当主立面设计**：
             "应加大山墙进深，充分体现建筑的稳重感、体量感"。
             → 山墙给竖向通高线条，不做密集窗格。
          ⑨ **色彩**："避免大面积采用高明度色、高纯度色、深暗色系，
              宜综合运用主色、辅助色和点缀色"。
             → 调色板已按此收敛（见 PALETTE_*）。

     落到体素上的实现：材质只有 4 种（body / trim / glass / dark），
     所以这些构件是靠**几何排布**表达的 —— 谁在哪里、占几格、什么颜色，
     由下面的判据决定，优先级从上到下（先判定的先拿走）。

     ⚠️⚠️ 这一版修正的核心问题是**明暗配比**。上一版的判据里
        roof=trim / base=dark / 竖框=dark / 雨棚=dark / 电梯机房=dark /
        天线=dark，而 body（浅色主色）只在"既不是窗、又不是线脚"的
        剩余格子上出现 —— 结果整栋楼 60~70% 的格子是 mid-dark，
        正撞在"避免大面积采用深暗色系"上，远景就是一片黑墩子。
        修法：把 dark 的适用范围**收紧到只做点缀色**（基座外皮、竖框、门洞），
        屋顶面改用**浅色**（真实屋面是浅灰防水层，本来就不该是黑的），
        电梯机房改用 trim（混凝土盒子，中灰），天线保留 dark（细，占比极小）。
        这样 body 稳定拿到立面面积的 45%+，才是"浅色墙面为主的住宅"。 */

  /* ── 立面风格参数（按 style 取，与 PALETTE_* 成套）─────────────────
     ⚠️ 层高 FLOOR_H / 窗宽 WIN_W / 窗间墙 WIN_GAP / 竖框间距 VBAR /
        腰线厚 HSILL 这五个值在 makeBuilding 开头就已经按 style 定好了
        （见上面的 stylePar）。这里的 `facade` 是**同一套值的具名引用**，
        纯粹为了让下面的分类判据读起来有语义（facade.WIN_W 比 WIN_W 清楚），
        不要再定义第二份数值 —— 两份数值一定会漂移。 */
  const facade = { FH: FLOOR_H, WIN_W, WIN_GAP, VBAR, HSILL };
  /* 下面这个别名只用于"这栋楼是不是石材楼"这类风格分叉判据，
     避免在循环里反复写 style === 'stone'。 */
  const isStoneStyle = style === 'stone';

  /* 每层内相对高度 local（0 = 楼层线/腰线，越靠近 FLOOR_H-1 越是窗顶）：
        local 0            → 腰线（trim，仅 HSILL>0 时）
        local 1 .. FLOOR_H-2 → 窗与窗间墙
        local FLOOR_H-1    → 窗楣（上层楼板，留给 trim/body） */
  const bandLocal = facade.HSILL;                 // 腰线占用到第几格为止

  /* 空调机位（⑤）：住宅立面的标志性构件。
     真实做法是"每户一个、结合阳台布置、外侧加百叶"。
     在体素上做成**成组的深色小方块**，每 VBAR*2 格一个、只占 1 格宽 × 1 格高，
     贴在立面上 —— 这样 dark 有存在感但面积很小，符合"点缀色"的定位。 */
  const acAt = (u, y) => {
    const period = VBAR * 2;
    const f = Math.floor(y / FLOOR_H);
    const local = y - f * FLOOR_H;
    /* 只放在每层的中段那一格，且横向每 period 格一个 */
    if (local !== Math.max(1, Math.floor(FLOOR_H / 2))) return false;
    return (((u % period) + period) % period) === Math.floor(period / 2);
  };

  /* ── 封闭阳台带（⑥）—— 住宅立面上**最强的识别特征** ──────────────
     查证到的做法：
       · "住宅南立面阳台应进行封闭设计"（多个城市的住宅品质提升指引都有这条）
       · "设备平台外侧维护设施建议采用玻璃栏板"
       · "阳台是住宅立面最重要的造型元素，其韵律感决定了立面是否'像住宅'"

     为什么必须加：不加的话，楼面就是一格格的独立小窗 —— 那是**办公楼**
     的立面对称图案。真实小区的立面上，每层都有一条**通长的玻璃横带**
     （封闭阳台 / 落地窗），横带之间才是墙面与窗间墙。
     横带这个"长横线"建立了水平韵律，一眼就能把住宅和写字楼分开。

     体素实现：
       · 带子所在行：整面连续 glass（通长，不再按 WIN_W/WIN_GAP 打洞）
       · 竖向分格缝（vbarAt）仍然生效，会把长带切成一段段"各户的阳台"
         —— 这正是真实立面的样子（一户一段，缝是户与户的分界）
       · 转角（isCorner）不动，保持 trim 的角柱，阳台带不会绕到拐角上
       · 基座段不做（基座是实墙 + 小窗，没有阳台）
     ⚠️ 只在 brick / stone 上做 —— glass 风格本来就是通高幕墙，
        再加一条"通长带"就没有虚实对比了，反而糊成一片。 */
  const hasBalcony = style !== 'glass';
  const balconyLocal = FLOOR_H - 2;                // 阳台玻璃带所在行

  for (let y = 0; y < H; y++) {
    const f = Math.floor(y / FLOOR_H);
    const local = y - f * FLOOR_H;
    const isBase = y < BASE_H;                      // 基座层（按层数算，见上）
    const isBand = !isBase && local < bandLocal;    // 横向腰线（只占 1 格）
    const isCrown = y >= CROWN_Y;                   // 顶部收头段

    for (let x = 0; x < W; x++) {
      for (let z = 0; z < D; z++) {
        if (!isShell(x, y, z)) continue;
        const lidx = idx(x, y, z);
        /* 四个水平方向各自的暴露情况 */
        const eX0 = !inB(x - 1, y, z) || !isShell(x - 1, y, z);
        const eX1 = !inB(x + 1, y, z) || !isShell(x + 1, y, z);
        const eZ0 = !inB(x, y, z - 1) || !isShell(x, y, z - 1);
        const eZ1 = !inB(x, y, z + 1) || !isShell(x, y, z + 1);
        const onXFace = eX0 || eX1;                   // 外侧是 X 向立面（窗沿 Z 排）
        const onZFace = eZ0 || eZ1;                   // 外侧是 Z 向立面（窗沿 X 排）
        const onTop = !inB(x, y + 1, z) || !isShell(x, y + 1, z);
        const onBot = y === 0 || !inB(x, y - 1, z) || !isShell(x, y - 1, z);
        const isCorner = onXFace && onZFace;           // 竖向角柱

        let kind;
        if (onTop) {
          /* 屋面：**浅色**。真实屋面是浅灰防水卷材/浅色保护层，
                而且"屋顶外表面宜采用浅色处理"以减少夏季吸热（规范原文）。
                ⚠️ 上一版这里是 trim，远看屋顶一片中灰；
                   实际从高空俯瞰城市时，屋顶是最显眼的面积之一，
                   用浅色立刻让整片城区亮起来。 */
          kind = 'body';
        } else if (onBot) {
          /* 底面：整栋楼最下面那层壳格，**从任何外部视角都看不到**
             （它贴着地面）。给 body 浅色即可。
             ⚠️ 曾经给它 dark —— 底面是一片 w×d 的整面（14×14 就是 196 格），
                占了全楼 7% 的格子却一个像素都看不见，纯粹把"深色占比"
                的统计搞脏。这类"看不到的格子"不该占用点缀色的预算。 */
          kind = 'body';
        } else if (isBase && (onXFace || onZFace)) {
          /* ① 基座：底部 2~3 层的**外露面**。
                这是最见效的一笔 —— 楼有了"脚"，不再像插在地上的柱子。
                与真实做法一致："住宅基座部分应采用石材、陶板、金属板"、
                "下部厚重、材质偏深、开窗小或封闭，强化稳重感"。

                ⚠️⚠️ 材质拆成两层，是这一轮"去黑"的关键改动：
                  最底下 2 格（贴地那圈）→ dark   深色石材勒脚
                  其余基座               → trim   中色调石材基座
                上一版整个基座都是一片 dark，而基座占立面高度的
                  BASE_FLOORS/FLOOR_H ÷ 总高 ≈ 12%~25%，
                这是一块**大面积深暗色**，正好违反"避免大面积采用深暗色系"。
                拆成"细勒脚 + 中调基座"后，dark 的占比从 ~25% 掉到 ~4%，
                而"楼有脚"的观感完全保留 —— 因为对比靠的是
                dark 与 trim 之间那一档明度差，不需要整片黑。 */
          kind = (y < Math.max(1, Math.round(BASE_H * 0.18))) ? 'dark' : 'trim';
        } else if ((onXFace && vbarAt(z)) || (onZFace && vbarAt(x))) {
          /* ② 竖向分格缝：每个窗周期一条，**落在窗间墙的中线上**。
                它是"竖向线条的视觉引导"（规范原文："利用阳台外框、柱体线条
                或色彩竖带，形成竖向的视觉引导……使住宅显得更加挺拔"）。
                ⚠️ 用 trim（辅助色）不用 dark —— 真实的分格缝是凹槽，
                   明度只比墙面低一档。用 dark 会变成一条条黑杠，
                   在只有 7~8 格宽的立面上尤其刺眼（详见 vbarAt 的注释）。 */
          kind = 'trim';
        } else if (isBand) {
          /* ③ 横向腰线（楼层线）—— **只占 1 格**，小精巧。
                真实指引反复强调腰线不能粗大，"做到腰线尽量小巧、精致"，
                粗腰线会把楼切成"千层饼"。
                放在窗之前判定，保证它一定可见（不会被玻璃盖掉）。
                用 trim（辅助色）而不是 dark —— 腰线是"分格线"，
                不应该是黑带。 */
          kind = 'trim';
        } else if (hasBalcony && !isBase && !isCorner && local === balconyLocal &&
                   (onXFace || onZFace)) {
          /* ④b 封闭阳台带（见 hasBalcony 的注释）：**通长玻璃**。
                它放在 punched 窗之前判定，于是会把这一整行吃掉 ——
                行内不再有窗间墙，形成真实的"横带"。
                ⚠️ 必须在 vbarAt 之后 —— 竖向分格缝要能把长带切成"一户一段"，
                   否则整栋楼是一条没有分户的玻璃腰带，更假。 */
          kind = 'glass';
        } else if ((onXFace && winAt(z, y)) || (onZFace && winAt(x, y))) {
          /* ④ 窗。窗墙比已按 GB 55015-2021 表 3.1.4 标定（见 stylePar）。 */
          kind = 'glass';
        } else if ((onXFace && acAt(z, y)) || (onZFace && acAt(x, y))) {
          /* ⑤ 空调机位：小方块点缀，做在窗之后（窗优先），
                保证它只出现在窗间墙/墙面上，不会切碎窗户。 */
          kind = 'dark';
        } else if (isCorner) {
          /* ⑥ 转角柱：竖向通高、比墙面略深一档的辅助色，体现"稳重感、体量感"。
                规范原文："鼓励采用金属材料、石材对建筑转角、阳台、檐口等
                重点部位进行处理"。
                ⚠️ 用 trim（辅助色）而不是 dark：转角是"重点部位处理"，
                   不是黑柱子。上一版用 trim 是对的，这一版保持。
                   但把它的判定挪到空调位之后，避免整根角柱把角吃掉。 */
          kind = 'trim';
        } else if (isCrown && (onXFace || onZFace) && local === 0) {
          /* ⑦ 顶部收头：最上面几层的腰线那一圈走 trim，
                做出"檐口线/女儿墙收边形成视觉终点"的 Crown 段。 */
          kind = 'trim';
        } else if (isStoneStyle && (onXFace || onZFace) && local === FLOOR_H - 1) {
          /* 石材楼：窗楣那一格走 trim，做出"每层一道浅檐"的层次
             （①"窗套/窗台板要有凹凸"）。只在石材楼上做。
             ⚠️ 判据用 FLOOR_H-1（每层最顶那一格）——
                原来是 FLOOR_H-2，但那一行现在是封闭阳台带，
                两者会打架（阳台带先判定就赢，这条变成死代码）。 */
          kind = 'trim';
        } else {
          kind = 'body';                                    // ⑧ 窗间墙（浅色主色）
        }
        addCell(lidx, kind);
      }
    }
  }

  /* ── 屋顶细节：女儿墙 + 电梯机房 + 天线 ────────────────────────────
     这些是"真楼"轮廓的关键。做法是先按需要把网格加高（在 H 之上再留几层），
     避免再出现"用 min(yy, H-1) 挤进顶层"那种会重复占位的写法。

     尺度（格）：楼高现在只有 28~65 格，所以细节比例要跟着放大 ——
       女儿墙 1~2 格   —— 高楼顶上一圈矮墙，剪影上一眼能认出来
       电梯机房 3~8 格 —— 屋顶上那个"盒子"，skyline 上最重要的非对称细节
       天线     4~9 格 —— 细到 1 格，剪影上像一根针（高楼才给） */
  const wallH = Math.max(1, Math.round(H * 0.030));          // 女儿墙高度（格）
  const hasPenthouse = H > 20 && Math.random() < 0.72;       // 天台电梯机房
  const pentH = hasPenthouse ? Math.max(3, Math.round(H * 0.10)) : 0;
  const hasMast = H > 36 && Math.random() < 0.55;            // 天线/避雷针
  const mastH = hasMast ? Math.max(4, Math.round(H * 0.16)) : 0;
  const EXTRA = wallH + pentH + mastH;

  /* 需要加高时，把 grid 换成更高的一块（旧数据在 y 方向是低位，直接前置拷贝）。
     y 是最高维 → 线性下标前 W*D*H 个正好就是原来的整块数据。
     ⚠️ H 是函数参数，不能重赋值；用 HG 记录"含屋顶细节之后的总高"。 */
  const H0 = H;                          // 原始屋顶高度（女儿墙从这里往上长）
  let HG = H;
  let G = grid;
  /* ⚠️ 加高时必须把 claimed 一起扩到 W*D*HG。
     以前 claimed 固定是 W*D*H（旧高），于是屋顶细节那些**新格**
     的 lidx 全都 >= claimed.length，被 addCell 的第一句挡掉 ——
     整段屋顶细节（女儿墙/机房/天线/雨棚）事实上一个格子都没生效，
     只是白白跑了一遍循环。实测就是靠"inst 比 alive 多出几个"
     才揪出来的。 */
  if (EXTRA > 0) {
    HG = H + EXTRA;
    const bigger = new Uint8Array(W * D * HG);
    bigger.set(grid);
    G = bigger;
  }
  rebindGrid(G);                          // grid / curG / claimed 三者同步
  const idxG = (x, y, z) => (y * D + z) * W + x;

  const yRoof = H0;
  const rb = halfAt(H0 - 1);

  if (EXTRA > 0) {
    /* ── 女儿墙：沿屋顶边缘一圈（从原始屋顶平面 yRoof 往上长 wallH 层）──
       直接遍历"楼顶那层的矩形外框"，四条边各走一遍（角上重复 addCell 会被
       claimed 挡掉，不会重复计数，所以不必特判去角）。

       ⚠️ 材质分两层，对应真实做法"女儿墙横向压顶线条……防止雨滴脏污墙面"：
            墙身（底下几格）→ body 浅色（同外墙）
            顶部那一格      → trim 压顶（略深的收边线）
          这样女儿墙是"浅色矮墙 + 一道深压顶"，
          而不是上一版那种整圈中灰（远看像楼顶围了一圈黑框）。 */
    const x0 = rb.x0 + CX, x1 = rb.x1 + CX;
    const z0 = rb.z0 + CZ, z1 = rb.z1 + CZ;
    for (let t = 0; t < wallH; t++) {
      const y = yRoof + t;
      if (y >= HG) break;
      const k = (t === wallH - 1) ? 'trim' : 'body';   // 最顶一格 = 压顶
      for (let x = x0; x <= x1; x++) {
        addCell(idxG(x, y, z0), k);
        addCell(idxG(x, y, z1), k);
      }
      for (let z = z0 + 1; z < z1; z++) {          // 去掉已画过的两角
        addCell(idxG(x0, y, z), k);
        addCell(idxG(x1, y, z), k);
      }
    }

    /* ── 天台电梯机房 + 出入口雨棚 ──────────────────────────────────
       电梯机房：屋顶中心一个盒子（只做壳，内部看不到）。
       这是 skyline 上最重要的"非对称细节"：有了它，楼的轮廓才算真的"有东西"。
       ⚠️ 尺寸必须跟着 H 缩放：H 只有 28~65 格时，
          原来按 wC 的 20% 算出来只有 1~2 格，等于没做。
       ⚠️⚠️ 材质必须是 **trim 而不是 dark**。上一版这里是整块 dark，
          而机房占楼宽的 26% × 楼高的 10%，是屋顶上最大的一块体量 ——
          它一个人就把"屋顶一片黑"坐实了。真实电梯机房是**混凝土盒子**，
          颜色与外墙接近、略深一档，不是黑铁块。 */
    if (hasPenthouse) {
      const pw = Math.max(2, Math.round(wC * 0.26));
      const pd = Math.max(2, Math.round(dC * 0.26));
      const cxw = CX + Math.round((Math.random() - .5) * wC * 0.22);  // 略微偏心更像真楼
      const czw = CZ + Math.round((Math.random() - .5) * dC * 0.22);
      const yTop = Math.min(yRoof + pentH, HG - 1);
      for (let y = yRoof; y <= yTop; y++) {
        for (let x = cxw - pw; x <= cxw + pw; x++) {
          for (let z = czw - pd; z <= czw + pd; z++) {
            if (x < 0 || x >= W || z < 0 || z >= D || y < 0 || y >= HG) continue;
            const edge = (x === cxw - pw || x === cxw + pw ||
                          z === czw - pd || z === czw + pd || y === yTop);
            /* 顶面（y === yTop）用 body 浅色 —— 从空中俯瞰时它是浅屋顶的一部分 */
            if (edge) addCell(idxG(x, y, z), y === yTop ? 'body' : 'trim');
          }
        }
      }

      /* ── 出入口雨棚（门厅）：在**基座**某一面外挑 2 格、高 1 格 ──────
         落地细节，街上视角第一眼看到的东西。挑在四面里随机一面。
         做法分两步：外挑的平板（trim 金属板），以及门洞（dark）。
         ⚠️ 雨棚平板用 trim 不用 dark：真实雨棚是金属板/仿石，
            不是一条黑带；而门洞必须是 dark —— 那才是真的"洞"。
         ⚠️⚠️ 外挑**必须自己钳到网格边界**，不能指望 addCell 的范围检查。
            addCell 只校验 lidx 是否落在 [0, len)，而 lidx = (y*D+z)*W+x ——
            z = -1 会算成 `(y*D - 1)*W + x`，指向**上一层的最后一行**，
            是一个完全合法但张冠李戴的下标：
            既不会报错，也不会被丢弃，而是在别的楼层、别的朝向凭空长出一格
            （这就是那 2 格来路不明悬空块的真正来源 —— 它们不是\"结构问题\"，
             是负坐标别名写坏了网格）。 */
      const rb0 = halfAt(0);
      const ax0 = rb0.x0 + CX, ax1 = rb0.x1 + CX;
      const az0 = rb0.z0 + CZ, az1 = rb0.z1 + CZ;
      const yCan = Math.min(BASE_H, HG - 1);     // 雨棚高度 = 基座顶上一格
      const CANT = 2;                            // 外挑格数
      const side = Math.floor(Math.random() * 4); // 0:-Z 1:+Z 2:-X 3:+X

      /* 网格范围内的合法夹取。[0, W-1] / [0, D-1] 之外一律丢掉。 */
      const clampX = (x) => Math.max(0, Math.min(W - 1, x));
      const clampZ = (z) => Math.max(0, Math.min(D - 1, z));

      if (side === 0 || side === 1) {
        /* 沿 X 展开、朝 ±Z 外挑 */
        const zEdge = side === 0 ? az0 : az1;
        const zTo = side === 0 ? az0 - CANT : az1 + CANT;
        const zLo = clampZ(Math.min(zEdge, zTo)), zHi = clampZ(Math.max(zEdge, zTo));
        for (let x = ax0; x <= ax1; x++)
          for (let z = zLo; z <= zHi; z++) addCell(idxG(clampX(x), yCan, z), 'trim');
        /* 门洞：出入口那一小段的基座换成 dark，正面一眼能看出"这里有个门" */
        const doorW = Math.max(1, Math.round((ax1 - ax0 + 1) * 0.16));
        const xm = Math.round((ax0 + ax1) / 2);
        for (let x = xm - doorW; x <= xm + doorW; x++)
          for (let t = 0; t < yCan; t++) addCell(idxG(clampX(x), t, clampZ(zEdge)), 'dark');
      } else {
        /* 沿 Z 展开、朝 ±X 外挑 */
        const xEdge = side === 2 ? ax0 : ax1;
        const xTo = side === 2 ? ax0 - CANT : ax1 + CANT;
        const xLo = clampX(Math.min(xEdge, xTo)), xHi = clampX(Math.max(xEdge, xTo));
        for (let z = az0; z <= az1; z++)
          for (let x = xLo; x <= xHi; x++) addCell(idxG(x, yCan, clampZ(z)), 'trim');
        const doorW = Math.max(1, Math.round((az1 - az0 + 1) * 0.16));
        const zm = Math.round((az0 + az1) / 2);
        for (let z = zm - doorW; z <= zm + doorW; z++)
          for (let t = 0; t < yCan; t++) addCell(idxG(clampX(xEdge), t, clampZ(z)), 'dark');
      }
    }

    /* ── 天线：屋顶正中一根细柱（细到 1 格，剪影上像一根针）── */
    if (hasMast) {
      for (let y = Math.max(0, HG - mastH); y < HG; y++) addCell(idxG(CX, y, CZ), 'dark');
    }

    /* ⚠️ 加高后必须把 H 换掉，否则后面 detach / slotOf 用的还是旧高度，
       而且数组长度对不上（会越界读到 undefined / 越界写入被静默丢弃）。
       grid / curG / claimed 已经在上面 rebindGrid(G) 处理过了。 */
    H = HG;
  }

  /* call site ②：所有会往网格里写东西的 stage 都结束了之后，最后兜一次底。
     ⚠️ 为什么必须有第二次 —— call site ①跑在"材质分类循环"之前，
        而后面的若干 stage 仍会用 addCell 往 curG 里写：
          女儿墙 / 电梯机房 / 雨棚 / 门洞 / 天线 / 网格加高
        只要其中任何一个在"下方没有支撑"的位置落笔，就会又长出悬空块。
        这里补出来的格子已经赶不上分类循环了，直接挂到 lists.body。 */
  {
    const added = repairFloating();
    for (const l of added) {
      if (claimed && l < claimed.length && claimed[l]) continue;
      if (claimed && l < claimed.length) claimed[l] = 1;
      lists.body.push(l);
    }
  }

  /* ── 建 InstancedMesh 组 ──
     四种材质各一个 InstancedMesh：body / trim / glass / dark。
     ⚠️ 顺序必须与下面 KIND_ID 的编号一致（1/2/3/4）—— detachVoxel 靠编号反查材质组。 */
  const VOX_KINDS = ['body', 'trim', 'glass', 'dark'];
  /* origin = 网格格 (0,0,0) 对应的世界坐标。
     网格比楼体宽 PAD 格（每边），所以网格原点要相应外移 PAD 格，
     这样**楼体的标称中心**才正好落在 (cx, cz) 上、楼底落在 y=0。 */
  const originX = cx - ((CX + 0.5) * V);
  const originZ = cz - ((CZ + 0.5) * V);
  const bld = {
    cx, cz, W, D, H, grid, style, mats, PAD, CX, CZ,
    groups: {}, meshes: [], cells: 0,
    /* 世界坐标换算：格 (x,y,z) → 世界 */
    wx: (x) => originX + x * V,
    wy: (y) => y * V,
    wz: (z) => originZ + z * V,
    originX, originZ,
    lidx: (x, y, z) => (y * D + z) * W + x,
    /* 反查：lidx → [x,y,z]（整数运算，比存坐标省 200MB） */
    unidx: (l) => { const y = Math.floor(l / (D * W)); const r = l - y * D * W;
                    const z = Math.floor(r / W); return [r - z * W, y, z]; },
  };

  for (const kind of VOX_KINDS) {
    const arr = lists[kind];
    if (arr.length === 0) continue;
    /* 分块合并渲染（见 commitCity）：这里只把每格的**平移与颜色**暂存进纯数组，
       等全城所有楼建完、按空间分好块之后一次性提交。
       矩阵全是纯平移（无旋转无缩放），存 3 个 float 就够；
       颜色是调色板基色 × 逐格明暗扰动，存 3 个 float。
       ⚠️ 平移直接烘成世界坐标 —— chunk mesh 的原点在 (0,0,0)。 */
    const n = arr.length;
    const g = {
      kind, used: n, count: n, cap: n + 16, base: -1, im: null, mat: mats[kind],
      index: new Int32Array(n + 16),
      tx: new Float32Array(n), ty: new Float32Array(n), tz: new Float32Array(n),
      col: new Float32Array(n * 3),
    };
    const c = mats[kind].color;
    const col = new THREE.Color();
    for (let i = 0; i < n; i++) {
      const [x, y, z] = bld.unidx(arr[i]);
      g.tx[i] = originX + x * V;
      g.ty[i] = y * V;
      g.tz[i] = originZ + z * V;
      g.index[i] = arr[i];
      /* 相邻格之间亮度差一点 → 纹理感（原逻辑逐字保留，只是改存进数组） */
      const nn = ((x * 73856093) ^ (y * 19349663) ^ (z * 83492791)) & 0xff;
      const k = Math.min(1.25, 1 + (nn / 255 - 0.5) * 0.16);
      col.copy(c).multiplyScalar(k);
      g.col[i * 3] = col.r; g.col[i * 3 + 1] = col.g; g.col[i * 3 + 2] = col.b;
    }
    bld.groups[kind] = g;
    bld.cells += n;
    totalVoxels += n;
  }

  /* lidx → {kind, slot} 的快速反查表。
     爆炸削块时要知道"这一格在哪个材质组的第几个实例"，直接用数组 O(1) 查，
     省掉原来的线性搜索（原实现一炮要扫几万格 × 每格扫几万项 = 爆炸卡死）。 */
  bld.slotOf = new Int32Array(W * D * H).fill(-1);
  bld.kindOf = new Uint8Array(W * D * H);   // 0=无 1=body 2=trim 3=glass 4=dark
  const KIND_ID = { body: 1, trim: 2, glass: 3, dark: 4 };
  for (const kind of VOX_KINDS) {
    const g = bld.groups[kind];
    if (!g) continue;
    for (let i = 0; i < g.used; i++) {
      bld.slotOf[g.index[i]] = i;
      bld.kindOf[g.index[i]] = KIND_ID[kind];
    }
  }

  /* 记录"完好状态下的底部承重占比"作为损伤基线（见 SUPPORT_RATIO 的注释）。
     ⚠️ 必须在这里记 —— collapseCheck 是**爆炸后**才跑的，那时楼已经被打过了，
        再"按当时的状态"取基线会把损伤当成常态，阈值就永远追不上损伤。
         所以只能在生成时、网格还是完好的时候取一张"体检快照"。 */
  bld.frac0 = supportOf(bld).frac;

  /* ⚠️⚠️ 这里**不能** buildings.push(bld)。
     它曾经push过一次，而调用处 buildCity() 又 push 了 makeBuilding 的返回值 ——
     于是**每栋楼都在 buildings 里存在两份**（实测 56 项里只有 28 个不同位置），
     而且两份共享同一个 grid 数组引用。后果非常隐蔽：

       · 渲染：同一位置的 InstancedMesh 被算两遍（白白翻倍的开销）
       · 爆炸：explode 遍历 buildings，对两份各跑一次命中收集。
               第一份把 grid 削了、生成碎块；第二份读到 grid 已清空，
               detachVoxel 返回 null 全部跳过 —— 所以**碎块只生成一份**。
               但 b.cells 是挂在两个不同对象上的独立计数器，
               两个都被减了一次 → 求和之后**正好是碎块数的 2 倍**。
       · 于是探针里出现那个精确的 2:1（摘 704 / 生成 352），
               我为此查了好几轮，先后怀疑过碎块池、detachVoxel、
               perfTier 半径收缩，全部排除后才定位到这里。

     约定：makeBuilding 是**纯构造**，只负责造楼并返回；
     要不要入列由调用方决定。 */
  return bld;
}

function rand2(a, b) { return a + Math.random() * (b - a); }

/* 保留空实现（原先用于"合并静态体素"，现在是每楼 3 个 InstancedMesh，无需合并） */
function mergeStaticVoxels() {}

/* -------------------------------------------------------------------------
   关键操作：从建筑上"摘掉"一个方块
   —— 更新所属材质组的实例矩阵（swap-remove）并同步反查表。
   返回方块的世界坐标与颜色（给碎块用）。
   ------------------------------------------------------------------------- */
function detachVoxel(bld, lidx) {
  if (lidx < 0 || lidx >= bld.grid.length) return null;
  if (bld.grid[lidx] !== 1) return null;               // 已经没了

  const [x, y, z] = bld.unidx(lidx);
  const kindId = bld.kindOf[lidx];
  /* 编号 → 材质组名（与 makeBuilding 里的 KIND_ID 一一对应：1/2/3/4） */
  const kind = kindId === 3 ? 'glass' : kindId === 2 ? 'trim'
             : kindId === 4 ? 'dark' : 'body';
  const g = bld.groups[kind];
  if (!g) return null;

  const slot = bld.slotOf[lidx];
  /* ⚠️ 颜色必须在 eraseVox **之前**取 —— swap-remove 会把这个槽位的数据覆盖掉。
     优先取该格实例色（带逐格明暗扰动，碎块颜色更真实），回退到调色板基色。 */
  let voxCOLOR = g.mat.color;
  if (g.im && g.im.instanceColor && slot >= 0 && slot < g.used) {
    const a = g.im.instanceColor.array;
    const o3 = (g.base + slot) * 3;
    voxCOLOR = new THREE.Color(a[o3], a[o3 + 1], a[o3 + 2]);
  }
  if (slot >= 0 && slot < g.used && g.index[slot] === lidx) {
    const moved = eraseVox(g, slot);           // swap-remove，返回被挪过来的 lidx
    if (moved >= 0 && moved !== lidx) {
      bld.slotOf[moved] = slot;                // 修正被挪动的那个格子的位置记录
      bld.slotOf[lidx] = -1;
    } else {
      bld.slotOf[lidx] = -1;
    }
  }

  bld.grid[lidx] = 0;
  bld.kindOf[lidx] = 0;
  return {
    wp: new THREE.Vector3(bld.wx(x), bld.wy(y), bld.wz(z)),
    color: voxCOLOR,
    kind,
  };
}

/* 标记建筑是否已被削空。
   新版用 bld.cells（当前剩余方块数）判定 —— 不再维护 Set。 */
function checkRubble(bld) {
  if (bld.cells <= 0 && !bld.razed) {
    bld.razed = true;
    stats.buildingsRazed++;
  }
}

/* ============================== 音效（WebAudio 合成） ============================== */
const Audio = (() => {
  let ctx = null, master = null, noiseBuf = null, enabled = true;
  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { enabled = false; return; }
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.5;
    master.connect(ctx.destination);
    // 预生成白噪声
    const len = ctx.sampleRate * 1.2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function resume() { init(); if (ctx && ctx.state === 'suspended') ctx.resume(); }

  function noise(dur, gain, filterType, freq, q, decay) {
    if (!ctx || !enabled) return () => {};
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = filterType; f.frequency.value = freq; f.Q.value = q || 1;
    const g = ctx.createGain();
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (decay) f.frequency.exponentialRampToValueAtTime(decay, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.02);
    return () => { try { src.stop(); } catch (e) {} };
  }
  function tone(f0, f1, dur, gain, type) {
    if (!ctx || !enabled) return;
    const o = ctx.createOscillator();
    o.type = type || 'sine';
    const g = ctx.createGain();
    const t = ctx.currentTime;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }

  return {
    resume, init,
    get ready() { return !!ctx && enabled; },
    setEnabled(v) { enabled = v; if (master) master.gain.value = v ? 0.5 : 0; },
    cannon() {
      // 炮击：低频砰 + 高频噪声
      tone(180, 42, 0.22, 0.32, 'sawtooth');
      noise(0.16, 0.24, 'lowpass', 1400, 1, 300);
    },
    explode(power) {
      const p = Math.min(1.4, power || 1);
      tone(95, 28, 0.55 * p, 0.5 * p, 'sine');       // 低频轰鸣
      tone(240, 45, 0.3 * p, 0.2 * p, 'triangle');
      noise(0.85 * p, 0.42 * p, 'lowpass', 2600, 0.9, 160); // 爆裂
      noise(0.13, 0.3 * p, 'highpass', 3200, 0.7);          // 脆响
    },
    crumble(n) {
      // 砖石碎裂：短促颗粒噪声，按碎块数量叠几层
      const k = Math.min(4, 1 + Math.floor(n / 22));
      for (let i = 0; i < k; i++)
        setTimeout(() => noise(0.13, 0.11, 'bandpass', 900 + Math.random() * 2600, 1.4), i * 26);
    },
    land() { tone(120, 55, 0.1, 0.1, 'sine'); },
    ui() { tone(680, 900, 0.07, 0.1, 'square'); },
  };
})();

/* ============================== 冲击波 / 粒子特效 ============================== */
/* 冲击波：扩张的环形膜（ShaderMaterial）
   火花：Points 粒子
   烟尘：半透明球体 */
const shockGeo = new THREE.SphereGeometry(1, 24, 14);
const shockMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  uniforms: { uT: { value: 0 }, uColor: { value: new THREE.Color(0xffd9a0) } },
  vertexShader: `varying vec3 vN; varying vec3 vP;
    void main(){ vN = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position,1.0); vP = mv.xyz;
      gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying vec3 vN; varying vec3 vP; uniform float uT; uniform vec3 uColor;
    void main(){
      float rim = pow(1.0 - abs(dot(normalize(vN), normalize(-vP))), 2.2);
      float a = rim * (1.0 - uT) * 0.95;
      gl_FragColor = vec4(uColor, a);
    }`,
});
const shockPool = [];
for (let i = 0; i < 10; i++) {
  const m = new THREE.Mesh(shockGeo, shockMat.clone());
  m.visible = false; m.renderOrder = 5;
  scene.add(m);
  shockPool.push({ mesh: m, t: 0, dur: 0, max: 0, active: false });
}
function spawnShock(pos, radius) {
  let s = shockPool.find(o => !o.active) || shockPool[0];
  s.active = true; s.t = 0; s.dur = 0.52; s.max = radius * 1.15;
  s.mesh.visible = true;
  s.mesh.position.copy(pos);
  s.mesh.scale.setScalar(radius * 0.28);
  return s;
}
function updateShocks(dt) {
  for (const s of shockPool) {
    if (!s.active) continue;
    s.t += dt;
    const k = s.t / s.dur;
    if (k >= 1) { s.active = false; s.mesh.visible = false; continue; }
    const e = 1 - Math.pow(1 - k, 2.6);          // ease-out
    s.mesh.scale.setScalar(0.28 * s.max + e * s.max * 0.86);
    s.mesh.material.uniforms.uT.value = k;
    s.mesh.material.uniforms.uColor.value.setHSL(0.075 + k * 0.06, 0.9, 0.72 - k * 0.28);
  }
}

/* 火花粒子 */
const SPARK_MAX = 700;
const sparkGeo = new THREE.BufferGeometry();
const sparkPos = new Float32Array(SPARK_MAX * 3);
const sparkCol = new Float32Array(SPARK_MAX * 3);
const sparkAlive = new Float32Array(SPARK_MAX);
const sparkVel = new Float32Array(SPARK_MAX * 3);
const sparkLife = new Float32Array(SPARK_MAX);
const sparkMaxLife = new Float32Array(SPARK_MAX);
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkCol, 3));
sparkGeo.setAttribute('alpha', new THREE.BufferAttribute(new Float32Array(SPARK_MAX), 1));
const sparkMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexColors: true,
  uniforms: { uSize: { value: 26 } },
  vertexShader: `
    attribute float alpha; varying vec3 vC; varying float vA;
    uniform float uSize;
    void main(){
      vC = color; vA = alpha;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      gl_PointSize = uSize * (1.0 / -mv.z) * (0.45 + alpha);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vC; varying float vA;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = (1.0 - r*4.0) * vA;
      gl_FragColor = vec4(vC, a);
    }`,
});
const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
sparkPoints.frustumCulled = false;
scene.add(sparkPoints);
let sparkCursor = 0;

function spawnSparks(pos, n, speed, colA, colB) {
  const ca = new THREE.Color(colA), cb = new THREE.Color(colB);
  for (let i = 0; i < n; i++) {
    const idx = sparkCursor; sparkCursor = (sparkCursor + 1) % SPARK_MAX;
    sparkAlive[idx] = 1;
    sparkMaxLife[idx] = 0.35 + Math.random() * 0.6;
    sparkLife[idx] = sparkMaxLife[idx];
    sparkPos[idx * 3]     = pos.x + (Math.random() - .5) * .4;
    sparkPos[idx * 3 + 1] = pos.y + (Math.random() - .5) * .4;
    sparkPos[idx * 3 + 2] = pos.z + (Math.random() - .5) * .4;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    const sp = speed * (0.35 + Math.random() * 0.85);
    sparkVel[idx * 3]     = Math.sin(ph) * Math.cos(th) * sp;
    sparkVel[idx * 3 + 1] = Math.abs(Math.cos(ph)) * sp * 1.05 + 3;
    sparkVel[idx * 3 + 2] = Math.sin(ph) * Math.sin(th) * sp;
    const t = Math.random();
    const c = ca.clone().lerp(cb, t);
    sparkCol[idx * 3] = c.r; sparkCol[idx * 3 + 1] = c.g; sparkCol[idx * 3 + 2] = c.b;
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkGeo.attributes.color.needsUpdate = true;
}
function updateSparks(dt) {
  const attr = sparkGeo.attributes.position;
  const al = sparkGeo.attributes.alpha;
  let any = false;
  for (let i = 0; i < SPARK_MAX; i++) {
    if (!sparkAlive[i]) { if (al.array[i] !== 0) { al.array[i] = 0; any = true; } continue; }
    any = true;
    sparkLife[i] -= dt;
    if (sparkLife[i] <= 0) { sparkAlive[i] = 0; al.array[i] = 0; continue; }
    const vi = i * 3;
    sparkVel[vi + 1] += CFG.GRAVITY * 0.55 * dt;
    sparkVel[vi] *= (1 - 1.5 * dt);
    sparkVel[vi + 1] *= (1 - 0.7 * dt);
    sparkVel[vi + 2] *= (1 - 1.5 * dt);
    sparkPos[vi]     += sparkVel[vi] * dt;
    sparkPos[vi + 1] += sparkVel[vi + 1] * dt;
    sparkPos[vi + 2] += sparkVel[vi + 2] * dt;
    al.array[i] = Math.min(1, sparkLife[i] / sparkMaxLife[i] * 1.6);
  }
  if (any) { attr.needsUpdate = true; al.needsUpdate = true; }
}

/* 烟尘：膨胀 + 上浮 + 淡出的球 */
const DUST_MAX = 70;
const dustGeo = new THREE.IcosahedronGeometry(1, 1);
const dustPool = [];
for (let i = 0; i < DUST_MAX; i++) {

  });
  const m = new THREE.Mesh(dustGeo, mat);
  m.visible = false;
  scene.add(m);
  dustPool.push({ mesh: m, t: 0, dur: 1, max: 1, vy: 0, active: false, spin: 0 });
}
function spawnDust(pos, n, radius) {

    const d = dustPool.find(o => !o.active);
    if (!d) return;
    d.active = true; d.t = 0;

    d.max = radius * (0.42 + Math.random() * 0.75);
    d.vy = 0.6 + Math.random() * 1.5;
    d.spin = (Math.random() - .5) * 1.6;
    const th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI;
    const rr = radius * Math.random() * 0.5;
    d.mesh.position.set(
      pos.x + Math.sin(ph) * Math.cos(th) * rr,
      pos.y + Math.cos(ph) * rr * 0.6 + 0.4,
      pos.z + Math.sin(ph) * Math.sin(th) * rr
    );
    d.mesh.scale.setScalar(d.max * 0.35);
    d.mesh.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);

function updateDust(dt) {
  for (const d of dustPool) {
    if (!d.active) continue;
    d.t += dt;
    const k = d.t / d.dur;
    if (k >= 1) { d.active = false; d.mesh.visible = false; continue; }
    const grow = 0.35 + (1 - Math.pow(1 - k, 2)) * 1.0;
    const s = d.max * grow;
    d.mesh.scale.set(s, s * (0.82 + k * 0.3), s);
    d.mesh.position.y += d.vy * dt * (1 - k * 0.6);
    d.mesh.rotation.y += d.spin * dt;
    d.mesh.material.opacity = Math.sin(Math.min(1, k * 2.4) * Math.PI * 0.5) *
                              (1 - k) * 0.5;
  }
}

/* ============================== 炮弹 ============================== */
const SHELL_MAX = 26;
const shellGeo = new THREE.SphereGeometry(0.30, 14, 10);
const shellMat = new THREE.MeshStandardMaterial({
  color: 0xffb347, emissive: 0xff6a1a, emissiveIntensity: 1.9, roughness: 0.4,
});
const shells = [];
for (let i = 0; i < SHELL_MAX; i++) {
  const m = new THREE.Mesh(shellGeo, shellMat);
  m.visible = false; m.castShadow = false;
  scene.add(m);
  shells.push({ mesh: m, active: false, vel: new THREE.Vector3(), life: 0, trail: null });
