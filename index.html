/* 炮弹轨迹：拖尾线 */
function makeTrail() {
  const N = 26;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  g.setAttribute('alpha', new THREE.BufferAttribute(new Float32Array(N), 1));
  g.setDrawRange(0, N);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uC: { value: new THREE.Color(0xffc46b) } },
    vertexShader: `attribute float alpha; varying float vA;
      void main(){ vA=alpha; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying float vA; uniform vec3 uC;
      void main(){ gl_FragColor = vec4(uC, vA*0.85); }`,
  });
  const line = new THREE.Line(g, mat);
  line.frustumCulled = false;
  scene.add(line);
  return { line, geo: g, mat, N, pts: new Array(N).fill(null).map(() => new THREE.Vector3()), filled: 0 };
}

/* 炮弹拖尾用 Points 更好看（有粗细感） */
const trailPool = [];
for (let i = 0; i < SHELL_MAX; i++) trailPool.push(makeTrail());

function fireShell(origin, dir, speed) {
  let idx = shells.findIndex(o => !o.active);
  if (idx < 0) { idx = 0; }               // 全部在用 → 复用第 0 发
  const s = shells[idx];
  s.active = true;
  s.life = 4.0;
  s.mesh.visible = true;
  s.mesh.position.copy(origin);
  s.vel.copy(dir).multiplyScalar(speed);
  s.trail = trailPool[idx];
  s.trail.filled = 0;
  s.trail.pts.forEach(p => p.copy(origin));
  return s;
}

function updateShells(dt, onHit) {
  for (const s of shells) {
    if (!s.active) continue;
    s.life -= dt;
    if (s.life <= 0) { s.active = false; s.mesh.visible = false; continue; }

    const p0 = s.mesh.position.clone();
    s.vel.y += CFG.SHELL_GRAVITY * dt;
    const step = s.vel.clone().multiplyScalar(dt);
    const p1 = p0.clone().add(step);

    // 射线检测：命中建筑 / 地面 / 静态物
    const dirN = step.clone().normalize();
    const dist = step.length();
    const ray = new THREE.Raycaster(p0, dirN, 0, dist + 0.25);

    let hit = null;
    // 城市包围盒粗筛
    const bd = hitBuildings(ray, p0, p1);
    if (bd) hit = bd;
    if (!hit && p1.y <= 0.05) {
      const t = (0 - p0.y) / (p1.y - p0.y || 1);
      hit = { point: new THREE.Vector3().lerpVectors(p0, p1, Math.max(0, Math.min(1, t))),
              normal: new THREE.Vector3(0, 1, 0), ground: true };
    }

    if (hit) {
      s.active = false; s.mesh.visible = false;
      onHit(hit.point, s.vel.clone());
      continue;
    }

    s.mesh.position.copy(p1);
    s.mesh.rotation.x += dt * 14; s.mesh.rotation.z += dt * 9;

    // 拖尾推进
    const tr = s.trail;
    tr.pts.pop();
    tr.pts.unshift(p1.clone());
    const pos = tr.geo.attributes.position.array;
    const al = tr.geo.attributes.alpha.array;
    for (let i = 0; i < tr.N; i++) {
      pos[i * 3] = tr.pts[i].x; pos[i * 3 + 1] = tr.pts[i].y; pos[i * 3 + 2] = tr.pts[i].z;
      al[i] = Math.pow(1 - i / tr.N, 1.7) * 0.9;
    }
    tr.geo.attributes.position.needsUpdate = true;
    tr.geo.attributes.alpha.needsUpdate = true;
  }
}

/* 射线 × 建筑体素。
   新架构下直接遍历**网格范围**（而不是几万个方块），用步进采样找最近命中，
   复杂度只跟"射线穿过多少格"有关，跟楼有几万块无关。 */
const _ray = new THREE.Ray();
const _tmpV = new THREE.Vector3();
const _box = new THREE.Box3();
function hitBuildings(ray, p0, p1) {
  /* ⚠️ 入参 ray 必须带 `.ray`（THREE.Ray）。传错类型时宁可静默不命中，
     也不要抛错 —— 这个函数在每帧的弹道循环里被调用，
     一次抛错就会打断整个 stepSim（表现为镜头/物理全停）。
     传入 CANNON.Ray 是典型误用：它没有 .ray 字段。 */
  if (!ray || !ray.ray || typeof ray.ray.copy !== 'function') return null;
  _ray.copy(ray.ray);
  let best = null, bestT = Infinity;

  /* ⚠️ 这里原来有个致命的采样上限 bug，表现是"前两炮能打中，之后再也打不中"：
     写成 `maxT = min(200, p0.distanceTo(p1) + 4)`，
     本意是"这一帧的路程再加点余量"。但炮弹速度 95、物理步长 1/60，
     **一帧只走 1.58 单位**，于是 maxT ≈ 5.6 —— 采样在离射线起点 5.6 米处就停了。
     而玩家常站在离楼 20 米外：前几炮之所以能中，是因为楼体在爆点附近
     （上一炮刚削出的缺口很近），一旦站位稍远，射线够不到墙面 → 整发穿过去。

     正确做法：采样上限要够到"射线与楼 AABB 的真实交点"，
     用 slab 法解出入参区间 [tMin, tMax]，只在这个区间内采样。
     这样不管站多远都能命中，且不会白扫区间外的空间。 */
  const o = _ray.origin, d = _ray.direction;

  for (const b of buildings) {
    if (b.cells <= 0) continue;

    /* 用网格范围算 AABB：网格是权威尺寸（含裙楼外扩） */
    const x0 = b.wx(0) - V / 2, x1 = b.wx(b.W - 1) + V / 2;
    const z0 = b.wz(0) - V / 2, z1 = b.wz(b.D - 1) + V / 2;
    const y1 = b.H * V;
    _box.min.set(x0, 0, z0);
    _box.max.set(x1, y1, z1);
    if (!_ray.intersectsBox(_box)) continue;

    /* slab 法：逐轴求射线进入/离开 AABB 的参数 t */
    let tMin = 0, tMax = 200, miss = false;
    for (const ax of ['x', 'y', 'z']) {
      const dd = d[ax];
      const oo = o[ax];
      const lo = _box.min[ax], hi = _box.max[ax];
      if (Math.abs(dd) < 1e-9) {
        if (oo < lo || oo > hi) { miss = true; break; }   // 平行且在区间外
      } else {
        let t1 = (lo - oo) / dd, t2 = (hi - oo) / dd;
        if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
        tMin = Math.max(tMin, t1);
        tMax = Math.min(tMax, t2);
        if (tMin > tMax) { miss = true; break; }
      }
    }
    if (miss) continue;

    /* 在这个区间里按**半格**步长采样（步长 < 格长，保证不漏格）。
       ⚠️ 这里是 V 的函数，不是写死的 —— V 从 0.1 放大到 0.4 之后，
          步长也跟着从 0.05 变成 0.2。写成常量会在 V 再变时悄悄漏格。 */
    const step = V * 0.5;
    for (let t = tMin + 1e-4; t <= tMax; t += step) {
      _tmpV.copy(o).addScaledVector(d, t);
      const gx = Math.round((_tmpV.x - b.originX) / V);
      const gy = Math.round(_tmpV.y / V);
      const gz = Math.round((_tmpV.z - b.originZ) / V);
      if (gx < 0 || gx >= b.W || gy < 0 || gy >= b.H || gz < 0 || gz >= b.D) continue;
      const lidx = b.lidx(gx, gy, gz);
      if (b.grid[lidx] === 1) {
        if (t < bestT) {
          bestT = t;
          best = {
            point: new THREE.Vector3(b.wx(gx), b.wy(gy), b.wz(gz)),
            cell: lidx, bld: b,
            normal: null,
          };
        }
        break;                       // 这栋楼已经找到最近命中，不必再往里扫
      }
    }
  }
  return best;
}

/* ============================== 结构坍塌 ==============================
   目标："打掉底部支撑 → 上面的部分失去支撑、在重力作用下塌下来"。

   ── 为什么不能"直接算一次就重建楼体" ──────────────────────────────
   最直觉的实现是：削块后对整栋楼做一次 3D flood fill，标记所有能连到地面的块，
   剩下的是悬空块，把它们整批转成碎块掉下去。

   问题在于**性能与代价**被低估了两次：
     1) flood fill 是 O(W·D·H)。V=0.1 时一栋楼的网格是 48×42×260 ≈ 52 万格，
        一次爆炸 × 56 栋楼 = 2900 万次访问，一炮就要几百毫秒 —— 直接掉帧。
     2) 就算填得动，也不能"瞬间整体塌"：那看起来是"楼被替换了一半"，
        而不是"塌"。

   ── 第一版做法（逐列模型）为什么失败 ──────────────────────────────
   最初按"每一列自下而上找悬空段"来实现 —— 对**实心**楼完全正确。

   但现在楼体是**外壳渲染**（见 makeBuilding 第二遍）：内部格子在生成时
   就被清零了，网格里只留 6 个面各一层。于是 (CX,·,CZ) 这根"中心柱"
   实际只有 y=0 一层地板壳 + y=H-1 一层屋顶壳，中间 40 多格全是空的。
   炸掉底部 3 格 → 屋顶那 1 格悬空 → 逐列模型认为"只有 1 格要塌"。
   实测 removed:1，楼纹丝不动。

   ── 现在采用的做法：整栋承重环模型 ────────────────────────────────
   真楼的倒塌不是"某根柱子塌"，而是"底部承重结构整体失效 → 上部整体坐下去"。
   所以判定单位从**列**换成**楼**：

     ① 量底部承重区（最下 GROUND_FLOOR = 4 层）在**整个占地**上的实心占比。
        正常情况下接近 1（四面外墙 + 内部地板都在）；被炮弹从底部啃穿一圈
        之后会掉到 0.5 上下。
     ② 占比 < THRESH = 0.55 → 判定"承重失效"。此时找出**最低的残留承重层**
        floorY（自下而上第一层还有实心的一层）：它就是即将失稳的那条线。
     ③ 把 floorY 及其以上**所有实心格**按高度升序（下面先掉）分批脱落。
        一批有上限（COLLAPSE_MAX_PER_FRAME × 2），于是视觉上是"逐层往下坐"，
        而不是"瞬间替换"。低层先离开，上面的格子自然在下一轮变成新的悬空段。
     ④ 一次掉不完的，登记进 collapseTrail，主循环每帧推一轮 —— 没有这一步
        一炮只炸出一个缺口，看不到"楼在塌"。

   支撑判定是 O(W·D·GROUND_FLOOR + 脱落格数)，与楼高无关。
   全楼 3D flood fill 在 V=0.1 时是 52 万格 × 56 栋 = 一炮几百毫秒，
   那条路依然走不通（见上面注释），但现在这个也不需要对整栋楼做连通性分析。

   ⚠️ 与 explode 的关系：它由 explode 调用（削块之后、计分之前）。
      同一炮里被坍塌摧毁的块也计入 stats.destroyed —— 玩家看到"整片墙垮了"，
      数字却不涨，会以为是 bug。 */

/* 底部承重区的高度（格）。4 格 = 1.6 世界单位 ≈ 一层的量级：
   恰好是炮弹（爆炸半径 3.0 单位）能一次啃穿的范围。 */
const GROUND_FLOOR = 4;

/* 承重占比跌到"自身完好基线"的多少比例以下 → 判定这栋楼"底部被掏空"。

   ⚠️⚠️⚠️ 这里本来是一个**绝对阈值**（0.44），是一处很隐蔽的设计缺陷，
        直到我把楼加宽（10×10 → 20×18）才暴露出来：

          完好楼的 frac = (地面整层板 + 3 层外圈周长) / (占地 × 4)
                        = (W·D + 3·P) / (4·W·D)，  P = 2(W+D) - 4

          这个式子**强烈依赖占地的宽高比**：
            10×10 → (100 + 108)/400  = 0.52    ← 高于 0.44，安全
            20×18 → (360 + 216)/1440 = 0.40    ← **低于 0.44，误判！**

          周长随边长线性增长，面积平方增长 —— 所以楼一宽，
          "满血 frac" 就自己往下掉，最后跌破绝对阈值。
          后果非常严重：**完好的楼在附近随便挨一发炮弹就会整栋自塌**
          （collapseCheck 对爆心半径内的每一栋楼都跑一遍，不只是被命中的那栋）。

          也就是说，这个阈值本质上不该是常数 —— 它是"占地形状的函数"。
          凡是这种"常数其实依赖别的变量"的地方，迟早会在某次参数调整后爆掉。

   修法：**改成相对基线**。每栋楼在生成时记录自己完好状态下的 frac（frac0），
        判定改成"比自己的基线掉了多少"：
            当前 frac < frac0 × SUPPORT_RATIO  → 底部真的被掏空了
        这样它与楼宽、体素尺寸、退台形状**全部解耦**，
        以后再怎么改场地/分辨率都不会再出现这种"调 A 崩 B"。
        另外真实结构工程里本来也是这么判的：看的是"剩余承载 / 原始承载"的**损伤度**，
        而不是某个绝对的截面含钢率。

   保留 SUPPORT_THRESH 只作为**兜底**（万一某栋楼没记上基线）。 */
const SUPPORT_RATIO = 0.65;      // 相对自身基线的损伤度阈值
const SUPPORT_THRESH = 0.44;     // 兜底绝对阈值（仅当 frac0 缺失时使用）

/* 承重扫描：返回 { frac, floorY, belowAlive, belowTotal }
     frac       —— 底部 GROUND_FLOOR 层的实心占比（0..1）
     floorY     —— 自下而上第一层"还有实心"的高度；全都空则 = -1
     belowAlive / belowTotal —— 分子/分母（调试用） */
function supportOf(b) {
  const W = b.W, D = b.D, g = b.grid;
  const Hc = Math.min(GROUND_FLOOR, b.H);
  let alive = 0;
  const total = W * D * Hc;
  for (let y = 0; y < Hc; y++) {
    const base = y * D * W;
    for (let x = 0; x < W; x++) {
      for (let z = 0; z < D; z++) if (g[base + z * W + x] === 1) alive++;
    }
  }
  /* 自下而上找第一层还有实心的 —— 它就是要塌的起始层。
     全空（楼已经被打没了）返回 -1，调用方直接跳过。 */
  let floorY = -1;
  for (let y = 0; y < b.H; y++) {
    const base = y * D * W;
    let any = false;
    for (let i = 0; i < W * D; i++) if (g[base + i] === 1) { any = true; break; }
    if (any) { floorY = y; break; }
  }
  return { frac: total > 0 ? alive / total : 1, floorY, belowAlive: alive, belowTotal: total };
}

let collapseDropped = 0;      // 累计因坍塌脱落的块数（供 HUD/调试查看）

/* ═══════════════════════════════════════════════════════════════════════════
   悬空块判定：从地面向上 flood fill 求「接地区域」，够不到地面的实心格 = 悬空。

   ── 为什么原来那套（承重占比）不够 ──────────────────────────────────
   承重占比只回答一个问题："**底部**还在不在"。它对"整栋楼从底部被掏空
   → 上部整体失稳"这个场景是对的，但对用户提的另一个场景**完全不成立**：

      「当房屋从中间断开（某层出现空缺或被移除）时，上方悬空的部分不会下落」

   举个具体例子：把 30 层楼中间的第 15 层整圈打掉。
     · 底部 → 完好，frac 依然 0.5 左右，远高于闸门 0.44 → 判定"站得住"
     · 实际  → 16~30 层是一个**悬在半空的整块**，底下完全没有支撑
   承重模型对它一点办法都没有 —— 它压根不看"中间断没断"。

   ── 现在补上的模型 ─────────────────────────────────────────────────
   物理上"有没有支撑"的定义是**连通性**：一块方块站得住，当且仅当存在一条
   只经过实心格、且能走到地面（y=0 那一层）的路径。
   于是：
     ① 从 y=0 的所有实心格出发做 6 邻域 BFS，标记所有可达格（= 接地的）
     ② 遍历全楼，凡是**实心但不可达**的格，就是悬空块
     ③ 悬空块按高度升序脱落（下面先掉，和 dropFrom 同一个道理）

   ── 性能 ───────────────────────────────────────────────────────────
   整栋楼 O(W·D·H)。现在 V=0.4，一栋楼的网格是 12×12×90 ≈ 1.3 万格
   （外壳占比低，实际访问量更小），56 栋全扫也就 70 万次 —— 一炮几毫秒，
   完全可接受。
   ⚠️ 但它**不能每帧跑**：collapsePump 是每帧调用的。
      所以只在两种时机做全量连通性分析：
        · 一次爆炸之后（collapseCheck 里）
        · 余波推进且"这一轮确实削掉了东西"之后（用脏标记触发）
      中间帧沿用缓存的悬空集合，不做重算。

   ── 与承重模型的关系（**不冲突**）──────────────────────────────────
   两个模型各管一半场景，输出汇聚到同一个出口 releaseFloating()：
     · 承重模型 —— 底部整体被掏空 → 整栋"坐下去"
     · 连通性模型 —— 中间断了 → 断了以上那截单独掉下来
   两者都会产出"要脱落的格"，但**会不会重复脱落同一格**？
   不会：脱落一律走 detachVoxel()，它第一句就检查 `grid[lidx] !== 1`，
   已经被摘掉的格返回 null、直接跳过。所以即使两个模型选中了同一批格，
   第二遍也是空转，不会出现"摘一次、掉两块"的账错。
   ─────────────────────────────────────────────────────────────────────────── */

/* 复用的 BFS 缓冲：按需扩容，避免每次分析都 tens of KB 的分配。
   ⚠️ 三个 Uint8Array 的长度都跟"当前这栋楼的网格大小"绑定，
      换楼时要重新分配（下面 seen.size !== n 的判断就是干这个的）。 */
let _supSeen = new Uint8Array(0);
let _supQueue = new Int32Array(0);

/* 求一栋楼里**所有接地的实心格**（能通过实心格路径走到 y=0）。
   返回 Uint8Array，1 = 接地、0 = 悬空/空。 */
function groundedMask(b) {
  const W = b.W, D = b.D, H = b.H, g = b.grid;
  const n = W * D * H;
  if (_supSeen.length !== n) {
    _supSeen = new Uint8Array(n);
    _supQueue = new Int32Array(n);
  } else {
    _supSeen.fill(0);
  }
  const seen = _supSeen;
  const q = _supQueue;
  let qh = 0, qt = 0;

  /* ① 种子：y=0 这一层（真正的地面）的所有实心格。
     ⚠️ 不种 y=0 的话，一栋"底部被炸空"的楼会一个种子都没有，
        整栋都被判成悬空 —— 那是"必塌"而不是"该塌的才塌"。
     但反过来，底部真被炸空时**确实应该整栋塌**，所以这里没问题：
     种子只在 y=0 这一格平面找，底部空了就是没有种子，
     上面的外壳自然全部不可达 → 全掉。这与承重模型给出的结论一致。 */
  const DWi = D * W;
  for (let i = 0; i < DWi; i++) {
    if (g[i] === 1 && !seen[i]) { seen[i] = 1; q[qt++] = i; }
  }

  /* ② 6 邻域 BFS。用整数增量代替 x/y/z 三重循环 —— 网格是稠密的，
     整数运算比反解坐标快得多。
     ⚠️ 索引布局是 lidx = (y*D + z)*W + x，所以：
          ±X → ∓1 步（同一 z 行内）
          ±Z → ∓W 步（同一 y 平面内换行）
          ±Y → ∓W*D 步（换层）
        x 的越界**不能**用 `x > 0` 判 —— 那样漏判 z 行交界处
        （x=W-1 的下一格正好是下一行 x=0，会被当成 ±X 邻居）。
        必须对 ±X 额外判断 x 的边界。 */
  const stepZ = W, stepY = D * W;
  while (qh < qt) {
    const cur = q[qh++];
    const x = cur % W;
    const y = Math.floor(cur / stepY);
    const z = Math.floor(cur / W) % D;
    /* ±X —— 只在同一行内移动 */
    if (x > 0)     { const j = cur - 1; if (!seen[j] && g[j] === 1) { seen[j] = 1; q[qt++] = j; } }
    if (x < W - 1) { const j = cur + 1; if (!seen[j] && g[j] === 1) { seen[j] = 1; q[qt++] = j; } }
    /* ±Z */
    if (z > 0)     { const j = cur - stepZ; if (!seen[j] && g[j] === 1) { seen[j] = 1; q[qt++] = j; } }
    if (z < D - 1) { const j = cur + stepZ; if (!seen[j] && g[j] === 1) { seen[j] = 1; q[qt++] = j; } }
    /* ±Y */
    if (y > 0)     { const j = cur - stepY; if (!seen[j] && g[j] === 1) { seen[j] = 1; q[qt++] = j; } }
    if (y < H - 1) { const j = cur + stepY; if (!seen[j] && g[j] === 1) { seen[j] = 1; q[qt++] = j; } }
  }
  return seen;
}

/* 收集一栋楼里的悬空格（实心 && 不接地），按高度升序返回 lidx 数组。
   `minCount` 是闸门：悬空块少于它就不算"塌"，避免削掉一块就触发。 */
function floatingCells(b, minCount) {
  const W = b.W, D = b.D, H = b.H, g = b.grid, seen = groundedMask(b);
  const out = [];
  for (let y = 0; y < H; y++) {
    const base = y * W * D;
    for (let i = 0; i < W * D; i++) {
      const lidx = base + i;
      if (g[lidx] === 1 && !seen[lidx]) out.push(lidx);
    }
  }
  /* 已经是"自下而上逐层扫"的，所以 out 天然就是高度升序 —— 不用再 sort。
     （sort 一栋楼几百项也不贵，但没必要。） */
  return out.length >= minCount ? out : null;
}

/* 把悬空格转成碎块脱落。
   与 dropFrom 的区别：**只摘传入的那批格**，不是"floorY 以上全部"。
   这正是"中间断了 → 上面那截掉"所要求的语义。 */
function releaseFloating(b, cells, quota) {
  const room = CFG.MAX_FLYING - flyCount;
  const cap = Math.min(quota, room);
  if (cap <= 0) return { dropped: 0, remaining: -1 };
  const n = Math.min(cells.length, cap);
  const ex = COLLAPSE_EXIT;
  let dropped = 0;
  for (let i = 0; i < n; i++) {
    const lidx = cells[i];
    const info = detachVoxel(b, lidx);
    if (!info) continue;              // 已被别的模型摘走 → 跳过（防重复计数）
    b.cells--; dropped++;
    /* 悬空块是"原地失重下落"，横向散开要比承重坍塌更小 ——
       它应该是"整片坐下去"，而不是"炸开"。 */
    _colImp.set(
      (Math.random() - .5) * ex * 0.6,
      -Math.abs(ex) * 0.2,
      (Math.random() - .5) * ex * 0.6
    );
    const spinK = 9;
    _colSpin.set((Math.random() - .5) * spinK, (Math.random() - .5) * spinK,
                 (Math.random() - .5) * spinK);
    spawnDebris(info.wp, info.color, _colImp, _colSpin);
  }
  return { dropped, remaining: cells.length - n };
}

/* 悬空块检查：这是"中间断开"场景的入口。
   返回 { dropped, remaining }，语义同 dropFrom。 */
function collapseFloating(b, quota) {
  /* 闸门用 CFG.COLLAPSE_MIN_UNSUPPORTED（默认 3）：
     少于 3 块的悬空不值得触发一次"塌"，否则削掉墙角两块就会看到
     一栋楼"抖一下"，反而假。 */
  const cells = floatingCells(b, CFG.COLLAPSE_MIN_UNSUPPORTED);
  if (!cells) return { dropped: 0, remaining: 0, found: 0 };
  const r = releaseFloating(b, cells, quota);
  return { ...r, found: cells.length };
}

/* 单轮坍塌预算：一次最多脱落多少格。
   楼的外壳总共 ~700 格，分 2~3 轮倒完 → 肉眼能看清"逐层往下坐"。
   取值比 CFG.COLLAPSE_MAX_PER_FRAME 大 —— 那个是"每帧上限"，这里是"每轮上限"，
   一轮 = 一次爆炸 或 一次余波推进，两者不是同一个时间尺度。 */
const COLLAPSE_ROUND_CAP = 900;

/* ---------------------------------------------------------------------------
   ⚠️ 一个隐蔽耦合：碎块池是**共享**的。
   explode 的单炮预算 1800 + 坍塌单轮预算 900 = 2700，池子只有 2600 格。
   ⚠️ 症状不是"碎块少"，而是**看起来像瞬间消失**：池满时 spawnDebris 直接
      落空，于是整栋楼 1386 格从 grid 里被摘掉、一个碎块都没进场景 ——
      用户明确要求"不要使用直接消失的效果"，这条会被悄悄违反。
   ⚠️ 排查时最容易看错的地方：这些"消失"的块**从来不存在于 flyMesh 里**，
      所以任何"按缓动着色"的检测都拍不到它们；它们只体现在
      stats.destroyed 的增量远大于 flyCount 的增量。
   处理：按实时剩余容量收窄 quota，保证"摘掉的每一格都配到了碎块"。
   这一轮放不下的留给下一轮（collapseTrail），宁可慢一点，不凭空蒸发。
   --------------------------------------------------------------------------- */

/* 把一栋楼 floorY 之上的实心格按高度升序脱落。
   返回 { dropped, remaining }：
     dropped   —— 本次真正脱落（= 真配到碎块）的格数
     remaining —— 还剩多少格没掉；-1 表示"被碎块池挡住，不是塌完了" */
const _colImp = new THREE.Vector3();
const _colSpin = new THREE.Vector3();
function dropFrom(b, floorY, quota) {
  /* 碎块池剩余容量 = 这一轮真正能"配到碎块"的上限。
     ⚠️ 必须用 flyCount 实时取，不能缓存 —— 池子里可能还留着上一栋楼的
        全套碎块（寿命 9 秒，同时存在好几栋很正常）。 */
  const room = CFG.MAX_FLYING - flyCount;
  const cap = Math.min(quota, room);
  /* 池子已经满了：这一轮一格都不摘。返回 -1 而不是 0，让调用方知道
     "是池子挡住了、不是塌完了"，从而**保留** collapseTrail 条目。 */
  if (cap <= 0) return { dropped: 0, remaining: -1 };

  /* 收集 floorY 以上的实心格。
     ⚠️ 必须现场收集而不是缓存 —— 上一轮脱落之后，下面没了支撑的格子
        会在下一轮被重新收进来，这正是"连锁塌"的来源。 */
  const cells = [];
  for (let y = floorY; y < b.H; y++) {
    const base = y * b.D * b.W;
    for (let x = 0; x < b.W; x++) {
      for (let z = 0; z < b.D; z++) {
        if (b.grid[base + z * b.W + x] === 1) cells.push([x, y, z, base + z * b.W + x]);
      }
    }
  }
  if (cells.length === 0) return { dropped: 0, remaining: 0 };

  /* 高度升序：**下面先掉**。顺序是必须的 —— 低层先离开，上面的格子才会在
     下一轮变成新的"无支撑段"；反过来先掉顶上的，底下的支撑还在，
     整片就永远塌不干净（会像被吸走而不是塌）。 */
  cells.sort((a, c) => a[1] - c[1]);
  const n = Math.min(cells.length, cap);
  const ex = COLLAPSE_EXIT;
  let dropped = 0;

  for (let i = 0; i < n; i++) {
    const [x, y, z, lidx] = cells[i];
    const info = detachVoxel(b, lidx);
    if (!info) continue;
    b.cells--; dropped++;
    /* 脱落速度：主体朝下（重力接管），横向只给一点散开 ——
       不然会像被炸出去一样四散，而不是"垮下来"。
       ⚠️ 单位是 单位/秒，不是冲量：碎块刚体 mass = 1，Δv = impulse。 */
    _colImp.set(
      (Math.random() - .5) * ex,
      -Math.abs(ex) * 0.35,
      (Math.random() - .5) * ex
    );
    /* 角速度 rad/s —— 16 rad/s ≈ 每秒转 2.5 圈，翻滚感刚好；
       再大就看不清方块形状了。 */
    const spinK = 16;
    _colSpin.set((Math.random() - .5) * spinK, (Math.random() - .5) * spinK,
                 (Math.random() - .5) * spinK);
    spawnDebris(info.wp, info.color, _colImp, _colSpin);
  }
  return { dropped, remaining: cells.length - n };
}

/* 坍塌结算：把"这一轮脱落的块数"记进统计 + 给反馈。
   抽出来是因为现在有两个模型（承重 / 连通性）都会产出脱落量，
   如果各写一遍，迟早有一边忘了加 destroyed 或忘了 addShake。 */
function settleCollapse(dropped) {
  if (dropped <= 0) return;
  collapseDropped += dropped;
  stats.destroyed += dropped;
  stats.score += dropped * 10;
  stats.best = Math.max(stats.best, dropped);
  Audio.crumble(Math.min(240, dropped * 3));
  addShake(Math.min(1.1, 0.22 + dropped * 0.004));
}

/* 坍塌检查：爆炸之后调用（center/radius 只用于**粗筛哪几栋楼可能受影响**）。
   ⚠️ 粗筛半径刻意放大到 1.6×爆炸半径：炮弹啃的是底部一圈，
      承重失效的判定要看整栋楼的占地，比爆心那一小片大得多。

   两个模型都在这里跑，**顺序有讲究**：
     ① 先跑承重模型 —— 它是"整栋坐下去"，会把底部掏空的楼整体放倒。
        跑完之后网格已经变干净，连通性分析看到的就是更新后的结构。
     ② 再跑连通性模型 —— 它负责"中间断开 → 上面那截单独掉"。
        反过来先跑连通性的话，底部被掏空的楼会因为"y=0 全空 → 无种子"
        被整栋判成悬空，那个"整栋塌"会被当成"悬空块"处理，
        观感上从"坐下去"变成"整片往下掉"，虽然也能塌但不如前者像楼。 */
function collapseCheck(center, radius) {
  if (!CFG.COLLAPSE) return 0;
  let total = 0;

  for (const b of buildings) {
    if (b.cells <= 0) continue;
    /* ① AABB 粗筛：爆心不在楼附近就跳过。
       用网格边界（含裙楼外扩 / PAD 余量），不是 wC × dC。 */
    const bx0 = b.wx(0) - V / 2, bx1 = b.wx(b.W - 1) + V / 2;
    const bz0 = b.wz(0) - V / 2, bz1 = b.wz(b.D - 1) + V / 2;
    if (center.x + radius < bx0 || center.x - radius > bx1) continue;
    if (center.z + radius < bz0 || center.z - radius > bz1) continue;

    /* ② 承重判定（底部整体是否还站得住）
       ⚠️ 用**相对基线**，不用绝对阈值 —— 理由见 SUPPORT_RATIO 的长注释。
          frac0 是这栋楼生成时记录的"完好 frac"，所以这里的判据是
          "底部承载相比自己完好时损失了多少"，与楼宽/体素尺寸无关。 */
    const sup = supportOf(b);
    if (sup.floorY < 0) continue;                    // 楼已经空了
    const baseFrac = b.frac0 > 0 ? b.frac0 : SUPPORT_THRESH;
    if (sup.frac < baseFrac * SUPPORT_RATIO) {
      /* 从最低残留层往上，本轮先倒一批 */
      const res = dropFrom(b, sup.floorY, COLLAPSE_ROUND_CAP);
      /* ⚠️ remaining === -1 表示"碎块池满了，一格都没摘"，不是"塌完了"。
         这时候要**保留**余波登记（池子腾出来之后还要接着塌），
         否则这栋楼会永远停在这个残缺状态上。 */
      if (res.remaining === -1) {
        collapseTrail.push({ b });
      } else if (res.dropped > 0) {
        total += res.dropped;
        settleCollapse(res.dropped);
        /* 余波：还倒不完的登记进 collapseTrail，主循环每帧推一轮。
           这里只存**楼引用**，不缓存爆心/半径 —— 下一轮要用的是这栋楼
           自己的新状态（新的 floorY、新的残留格），跟哪一炮打的关系不大了。 */
        if (res.remaining > 0) collapseTrail.push({ b });
      }
    }

    /* ③ 连通性判定（中间断开 → 上方悬空块掉落）。
       这是本轮新补的模型，专门服务"某层出现空缺"这个场景。
       ⚠️ 它必须在承重模型之后跑（见函数头注释）。
       ⚠️ 与承重模型可能选中同一批格 —— 但 detachVoxel 对已摘的格
          返回 null，所以不会重复计数，也不会"摘一次掉两块"。 */
    const fres = collapseFloating(b, COLLAPSE_ROUND_CAP);
    if (fres.remaining === -1) {
      /* 池子满：登记余波，等容量腾出来再掉。 */
      collapseTrail.push({ b });
    } else if (fres.dropped > 0) {
      total += fres.dropped;
      settleCollapse(fres.dropped);
      if (fres.remaining > 0) collapseTrail.push({ b });
    }

    checkRubble(b);
  }

  if (total > 0) refreshHUD();
  return total;
}

/* 坍塌余波：爆炸那一刻只掉了最底下一批，上面还悬着。
   主循环每帧推一次，把"还在坠落的楼"继续往下放 ——
   没有这一步，一炮就只炸出一个缺口，看不到"楼在塌"。
   ⚠️ 这里必须**原地**遍历：dropFrom 之后可能又 push 新条目，
      直接 for..of 遍历同一个数组会无限增长（经典自噬循环）。
   ⚠️ 池子满时要保留条目，否则这栋楼永远塌不完 —— 见 dropFrom 的注释。

   ⚠️ 这里**只推承重模型的续塌**（dropFrom）。为什么不在每帧也跑连通性模型？
      · 余波登记时这栋楼已经"正在塌"了，承重模型会一路把它放倒到底，
        它后面的悬空块自然被 dropFrom 一并收走（dropFrom 收的是
        floorY 以上**全部**实心格，不管接不接地）；
      · 而连通性模型一次 O(W·D·H)，每帧 × 几十栋 = 明显掉帧。
     所以连通性只在"爆炸之后"这一个时机做全量分析（collapseCheck），
     那是真正会改变结构拓扑的时刻。中间帧沿用承重模型即可。 */
function collapsePump() {
  if (!CFG.COLLAPSE || collapseTrail.length === 0) return;
  const batch = collapseTrail;
  collapseTrail = [];
  for (const t of batch) {
    const b = t.b;
    if (!b || b.cells <= 0) continue;
    /* 重新取 floorY：上一轮脱落之后最低残留层可能已经变了。 */
    const sup = supportOf(b);
    if (sup.floorY < 0) continue;
    const res = dropFrom(b, sup.floorY, COLLAPSE_ROUND_CAP);
    if (res.remaining === -1) { collapseTrail.push({ b }); continue; }
    if (res.dropped <= 0) continue;
    settleCollapse(res.dropped);
    if (res.remaining > 0) collapseTrail.push({ b });
    checkRubble(b);
    refreshHUD();
  }
}

/* ============================== 爆炸 ============================== */
const stats = { destroyed: 0, score: 0, buildingsRazed: 0, shots: 0, best: 0 };
let camShake = 0, camShakeMag = 0;

/* collapseTrail 是 collapseCheck 用的"还在倒塌中的楼"列表。
   ⚠️ 声明必须在这里、而不是函数定义旁边 —— collapseCheck 会在 crate 阶段
      之外被 explode 调用，但 collapseTrail 是 let，存在 TDZ。
      放在这段（所有函数定义之后、首次调用之前）是安全的。 */
let collapseTrail = [];

/* 屏幕震动 */
function addShake(mag) { camShakeMag = Math.max(camShakeMag, mag); camShake = Math.max(camShake, 1); }

/* 闪光 */
const flashEl = document.getElementById('flash');
let flashT = 0;
function addFlash(k) { flashT = Math.max(flashT, k); }

function explode(center, shellVel) {
  /* ---- 性能预算：**收窄爆炸半径**，而不是"让一部分方块消失" ----
     池子越满，这一炮的爆炸半径越小。玩家看到的是"爆炸变小了"，
     而不是"掉帧"或"方块不出现"。

     ⚠️ 这里踩过一个很隐蔽的坑，值得写下来：
        旧写法是"半径不变，但 flying 超过某个配额之后，**剩下的块照旧
        从 grid 里摘掉、却不生成碎块**"。它看起来只是"远处的块不飞"，
        实际上等于给用户明确要求禁止的"直接消失"开了一个后门 ——
        实测一炮摘掉 532 格只生成 266 个碎块，一半凭空蒸发。
        正确的关系是：**摘掉多少格，就必须生成多少个碎块**。
        所以"池子不够"只能通过"少摘"来表达，而少摘的唯一干净手段
        就是缩小半径（下面的 radius 已经含了 tier 收缩），
        绝不是"摘了但不给碎块"。
     结论：删掉那个 flying 配额分支，只保留"池子真的一个空位都没有"
     时才停下来。 */
  const tier = typeof perfTier === 'function' ? perfTier() : 0;
  const radius = CFG.BLAST_R * (1 - tier * 0.35);
  const r2 = radius * radius;

  /* ── 碎片飞散（不再是"三级削落 + 核心抹除"）─────────────────────────
     旧实现把命中球分三级：core（d < 0.42R）**直接抹除、不留碎块**。
     那是为了在 V=0.1（一炮几千块）时把刚体数量压下来 —— 但代价是
     爆炸中心是"凭空消失"的，像被橡皮擦擦掉，而不是被炸开。

     现在 V=0.4、格数掉了 64 倍，一炮的方块数从 ~3600 掉到 ~60，
     完全可以做到"**命中范围内每一块都变成独立碎块飞出去**"：
       · 全部给初速度（沿爆心→方块方向，带随机扰动）
       · 全部给随机角速度（翻滚）
       · 受重力自由下落，彼此碰撞、和地面碰撞
       · 落地静置后残留 REST_LINGER 秒再淡出
     于是"炸开"和"炸没了"的区别终于能被看见。

     ⚠️ 唯一的例外是**内部格**（六个面都被邻居包住的格子）。
        外壳生成阶段已经把它们清零了，所以正常情况下不存在。
        但坍塌之后可能出现"外面塌了、里面还剩一块"的情形 —— 那种格子
        就算脱离也看不见，徒占刚体，所以照旧直接移除。 */

  Audio.explode(1.0 - tier * 0.18);
  spawnShock(center, radius);
  spawnSparks(center, tier > 0.5 ? 30 : 56, 26, 0xfff3c4, 0xff5a1a);
  spawnDust(center, tier > 0.5 ? 9 : 15, radius * 1.05);

  const pushBase = BLAST_PUSH;
  let affected = 0;      // 总共移除的方块数
  let flying = 0;        // 其中变成碎块的数量
  const impulse = new THREE.Vector3();
  const spin = new THREE.Vector3();

  /* 只遍历"爆心附近的格"——而不是全城几万个方块。
     先把爆心换算成每栋楼的格坐标，取一个 radius 大小的立方窗口。 */
  const rC = Math.ceil(radius / V) + 1;         // 半径对应多少格

  for (const b of buildings) {
    if (b.cells <= 0) continue;

    /* 用网格 AABB 粗筛（用网格算，含裙楼外扩） */
    const bx0 = b.wx(0) - V / 2, bx1 = b.wx(b.W - 1) + V / 2;
    const bz0 = b.wz(0) - V / 2, bz1 = b.wz(b.D - 1) + V / 2;
    if (center.x + radius < bx0 || center.x - radius > bx1) continue;
    if (center.z + radius < bz0 || center.z - radius > bz1) continue;
    if (center.y - radius > b.H * V) continue;

    /* 爆心在网格坐标系里的位置 */
    const cx = (center.x - b.originX) / V;
    const cy = center.y / V;
    const cz = (center.z - b.originZ) / V;

    const gx0 = Math.max(0, Math.floor(cx - rC)), gx1 = Math.min(b.W - 1, Math.ceil(cx + rC));
    const gy0 = Math.max(0, Math.floor(cy - rC)), gy1 = Math.min(b.H - 1, Math.ceil(cy + rC));
    const gz0 = Math.max(0, Math.floor(cz - rC)), gz1 = Math.min(b.D - 1, Math.ceil(cz + rC));

    /* 收集命中方块，按距离排序（近的先处理 → 近处飞得更猛，冲击感从中心往外衰减） */
    const hits = [];
    for (let y = gy0; y <= gy1; y++) {
      for (let x = gx0; x <= gx1; x++) {
        for (let z = gz0; z <= gz1; z++) {
          const lidx = b.lidx(x, y, z);
          if (b.grid[lidx] !== 1) continue;
          const dx = b.wx(x) - center.x, dy = b.wy(y) - center.y, dz = b.wz(z) - center.z;
          const d2 = dx * dx + dy * dy + dz * dz;
          if (d2 > r2) continue;
          hits.push({ lidx, d: Math.sqrt(d2) });
        }
      }
    }
    if (hits.length === 0) continue;
    hits.sort((a, b2) => a.d - b2.d);

    for (const h of hits) {
      /* 边缘淡化：最外圈那一层用概率削，避免爆炸边界是"完美球面"。
         ⚠️ 这条 continue 发生在 detachVoxel **之前** —— 也就是"根本没碰它"，
            不是"摘了但不给碎块"。这个顺序是必须的：一旦先摘后判，
            就又变回"凭空蒸发"了。 */
      const dn = h.d / radius;             // 归一化距离 0..1
      if (dn > 0.86 && Math.random() > 0.55) continue;

      /* ⚠️ 池子一个空位都没有 → 停下来。
         这是**唯一**允许"少摘"的出口，而且它发生在摘除之前，
         所以"摘掉的每一格都配到了碎块"这条不变式始终成立。
         正常情况下走不到这里：perfTier 已经把半径收窄了。 */
      if (flyCount >= CFG.MAX_FLYING) break;

      const info = detachVoxel(b, h.lidx);
      if (!info) continue;
      affected++;
      b.cells--;

      flying++;
      const dx = info.wp.x - center.x, dy = info.wp.y - center.y, dz = info.wp.z - center.z;
      const d = Math.max(0.12, Math.sqrt(dx * dx + dy * dy + dz * dz));
      const f = Math.pow(1 - dn, 2);       // 越近越猛

      /* 初速度：径向为主 + 向上抬升（否则碎块都贴着地面扫射，堆不起来） */
      const radial = pushBase * (0.55 + f * 1.35);
      impulse.set(
        dx / d * radial,
        (dy / d * 0.55 + 0.62 + Math.random() * 0.5) * pushBase * (0.40 + f * 1.30),
        dz / d * radial
      );
      if (shellVel) {
        /* 炮弹自身的动量带一点到碎块上（"被炮弹推着走"的方向感）。
           0.11 是把炮弹蒙皮速度（~95 单位/秒）折算到碎块上的比例。
           ⚠️ 以前这里乘了 K_V/64 —— 那是同一个质量口径误解的残留。 */
        impulse.x += shellVel.x * 0.11;
        impulse.y += Math.max(0, shellVel.y) * 0.05;
        impulse.z += shellVel.z * 0.11;
      }
      impulse.x += (Math.random() - .5) * pushBase * 0.55;
      impulse.y += Math.random() * pushBase * 0.45;
      impulse.z += (Math.random() - .5) * pushBase * 0.55;

      /* 随机角速度：翻滚。rad/s，与 V 无关（惯性张量随质量走，但这里
         表现的是"转速"本身，直接用 rad/s 标定最直白）。
         26 rad/s ≈ 每秒 4 圈，高速旋转带来的"炸开感"很明显。 */
      const spinK = 26;
      spin.set((Math.random() - .5) * spinK, (Math.random() - .5) * spinK,
               (Math.random() - .5) * spinK);
      spawnDebris(info.wp, info.color, impulse, spin);
    }

    checkRubble(b);
  }

  /* ── 结构坍塌：爆炸之后立刻评估一次支撑 ──────────────────────────────
     放在削块之后、计分之前。原因：坍塌掉的块也算"被这次爆炸摧毁"，
     玩家期待的数字包含它们（打掉承重墙 → 上面整片跟着垮，这才叫拆迁）。
     见 collapseCheck() 的注释。 */
  if (CFG.COLLAPSE) collapseCheck(center, radius * 1.6);

  // 命中静态楼体过少时（打到地上），也给一点地面尘土
  if (affected === 0) spawnDust(center, 6, 3.0);

  Audio.crumble(affected);

  // 计分
  stats.destroyed += affected;
  const gained = affected * 10 + Math.round(affected / 25) * 50;
  stats.score += gained;
  stats.best = Math.max(stats.best, affected);

  // 反馈
  const mag = Math.min(1.5, 0.32 + affected * 0.0035);
  addShake(mag);
  addFlash(Math.min(0.55, affected * 0.0028));
  showHitmarker(affected);
  if (affected >= 90) {
    const combo = document.getElementById('combo');
    combo.textContent = `重创！ ${affected} 块 · +${gained}`;
    combo.classList.add('on');
    clearTimeout(combo._t);
    combo._t = setTimeout(() => combo.classList.remove('on'), 1400);
  }
  refreshHUD();
}

/* 命中标记 */
const hmEl = document.getElementById('hitmarker');
let hmT = 0;
function showHitmarker(n) {
  hmT = 1;
  const k = Math.min(1, 0.5 + n / 60);
  hmEl.style.opacity = String(k);
  hmEl.style.width = hmEl.style.height = `${16 + Math.min(12, n * 0.35)}px`;
}
function updateHitmarker(dt) {
  if (hmT <= 0) return;
  hmT -= dt * 4.5;
  hmEl.style.opacity = String(Math.max(0, hmT) * 0.9);
}

/* ============================== 玩家角色 ============================== */
/* 角色用胶囊刚体 + 组合式可视化（身体/头/腿/炮） */
const player = {
  body: null,
  mesh: new THREE.Group(),
  onGround: false,
  cocd: 0,
  aim: new THREE.Vector3(0, 0, -1),
  vel: new THREE.Vector3(),
  jumpCd: 0,
  meshParts: {},
};

function buildPlayer() {
  const g = player.mesh;

  const darkMat = new THREE.MeshLambertMaterial({ color: 0x2b3a52 });
  const suitMat = new THREE.MeshLambertMaterial({ color: 0x3f7fd0 });
  const skinMat = new THREE.MeshLambertMaterial({ color: 0xe8b48c });
  const accentMat = new THREE.MeshLambertMaterial({ color: 0xffd166 });
  const metalMat = new THREE.MeshLambertMaterial({ color: 0x556070 });

  // 躯干
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.72, 0.38), suitMat);
  torso.position.y = 0.98; g.add(torso);
  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.42), accentMat);
  chest.position.y = 1.06; g.add(chest);

  // 头
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.42, 0.42), skinMat);
  head.position.y = 1.58; g.add(head);
  const helmet = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.22, 0.48), darkMat);
  helmet.position.y = 1.74; g.add(helmet);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.13, 0.05),
    new THREE.MeshLambertMaterial({ color: 0x6ce0ff, emissive: 0x1a6a8a }));
  visor.position.set(0, 1.6, 0.21); g.add(visor);

  // 腿
  const legGeo = new THREE.BoxGeometry(0.22, 0.62, 0.24);
  const legL = new THREE.Mesh(legGeo, darkMat); legL.position.set(-0.16, 0.31, 0); g.add(legL);
  const legR = new THREE.Mesh(legGeo, darkMat); legR.position.set(0.16, 0.31, 0); g.add(legR);

  // 手臂
  const armGeo = new THREE.BoxGeometry(0.17, 0.5, 0.19);
  const armL = new THREE.Mesh(armGeo, suitMat); armL.position.set(-0.4, 1.06, 0); g.add(armL);

  // 大炮（右手持）—— 一个粗管子，带炮口环
  const cannonGroup = new THREE.Group();
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.22, 1.35, 12), metalMat);
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(0, 0, 0.45);
  cannonGroup.add(barrel);
  const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.16, 12), accentMat);
  muzzle.rotation.x = Math.PI / 2; muzzle.position.set(0, 0, 1.12);
  cannonGroup.add(muzzle);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.3, 0.16), darkMat);
  grip.position.set(0, -0.24, -0.12);
  cannonGroup.add(grip);
  // 炮口光晕
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xffb347, transparent: true, opacity: 0 }));
  glow.position.set(0, 0, 1.2);
  cannonGroup.add(glow);
  player.meshParts.glow = glow;

  cannonGroup.position.set(0.46, 1.12, 0.1);
  g.add(cannonGroup);
  player.meshParts.cannon = cannonGroup;
  player.meshParts.armR = cannonGroup;

  // 收集需要逐个投影的部件
  player.meshParts.legs = [legL, legR];
  player.meshParts.torso = torso;
  player.meshParts.head = head;

  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

  /* ⚠️ 体素放大 4 倍后，角色只有 1.9 / 0.4 ≈ 5 格高 ——
     而下面这套模型的原始尺寸是给"19 格高的角色"配的（总高约 1.95 世界单位）。
     所以整体缩到 PLAYER_SCALE（0.62）—— 缩完约 1.21 单位 ≈ 3 格，
     在一个 0.4 单位的方块世界里不至于被一格方块比下去。
     缩放施加在 group 上，物理胶囊（PLAYER_R）与世界坐标都不受影响，
     所以移动、跳跃、相机全都不用改。 */
  g.scale.setScalar(CFG.PLAYER_SCALE);

  // 脚下阴影盘（增强落地感）
  const shadowDisc = new THREE.Mesh(
    new THREE.CircleGeometry(0.62, 24),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false })
  );
  shadowDisc.rotation.x = -Math.PI / 2;
  shadowDisc.position.y = 0.03;
  scene.add(shadowDisc);
  player.meshParts.disc = shadowDisc;

  scene.add(g);

  // 物理体：胶囊（用 Sphere 组合更稳）
  const r = CFG.PLAYER_R;
  const shape = new CANNON.Sphere(r);
  const body = new CANNON.Body({
    /* mass 必须 > 0（否则会被当成静态体，完全不积分速度）。
       摩擦力交给 playerMat ↔ groundMat 的零摩擦 ContactMaterial 处理。 */
    mass: 5, material: playerMat,
    linearDamping: 0, angularDamping: 1, fixedRotation: true,
    collisionFilterGroup: GROUP_PLAYER, collisionFilterMask: PLAYER_FILTER,
    /* ⚠️ 角色**绝不能休眠**。
       cannon-es 的休眠判定看的是"速度连续 N 秒低于 sleepSpeedLimit"，
       站立不动时 velocity≈0 会立刻满足条件 → sleepState=2(SLEEPING)。
       一旦睡着，body 就不再被积分，我们每帧写进去的 velocity 会被彻底忽略，
       表现就是"站着不动之后再也走不动"。而且休眠会顺手把 velocity 清零，
       所以连"先攒速度再释放"的余地都没有。
       隔离复现：allowSleep=true 时 20 步位移 dz=0.0000，sleepState=2。 */
    allowSleep: false,
    sleepSpeedLimit: 0, sleepTimeLimit: 1e9,
  });
  body.addShape(shape);
  body.position.set(0, 3, 5);
  body.updateMassProperties();
  world.addBody(body);
  player.body = body;
}

/* 玩家移动（相对镜头方向） */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyB') { CFG.MINE_MODE = !CFG.MINE_MODE; Audio.ui(); }
  if (e.code === 'KeyM') { Audio.setEnabled(!Audio.ready || document.getElementById('sAmmo').textContent === '×'); }
  if (e.code === 'KeyR') { resetGame(); }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

let camYaw = 0, camPitch = -0.30;
let mouseDown = false;

addEventListener('mousemove', e => {
  if (!gameRunning) return;
  camYaw -= e.movementX * 0.00235;
  camPitch -= e.movementY * 0.00205;
  camPitch = Math.max(-1.25, Math.min(0.62, camPitch));
});
addEventListener('mousedown', e => { if (e.button === 0) { mouseDown = true; Audio.resume(); } });
addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
addEventListener('contextmenu', e => e.preventDefault());

const MOVE_ACC = 78;      // 加速度
const MAX_SPEED = CFG.SPEED;

/* 朝向解析：把"我朝哪边"统一到一个公式上，显示与逻辑共用。
   定义 camYaw 为**镜头前方**的水平角，前向量 = (sin, 0, cos)。
   ─ 玩家盒子默认朝 +Z
   ─ 炮口 = 从玩家胸口指向"准星命中点"（只用于外观，弹道由 solveShot 解算） */
function camForward(out) {
  const cp = Math.cos(camPitch);
  return out.set(Math.sin(camYaw) * cp, Math.sin(camPitch), Math.cos(camYaw) * cp);
}
/* 准星指向的那个世界点。
   ⚠️ 这里**不**再用"相机前方固定 42 单位"。
      那个魔法数在两层意义上都是错的：
        · 42 与真实射程无关，远处的楼永远够不到；
        · 从相机量 42 和从炮口量 42 差着 11 单位，朝向因此系统性偏平。
      改成打一条视线射线拿真实命中点（未命中则取远方），
      与 solveShot() 用的是同一条射线，于是"准星 / 角色朝向 / 弹着点"三者一致。

   ⚠️ hitBuildings 的第一个参数要能提供 `.ray`，且该 `.ray` 必须是 **THREE.Ray**
      （它内部 `_ray.copy(ray.ray)`，而 `_ray` 是 THREE.Ray）。
      所以这里必须用 THREE.Raycaster —— **不要**用 CANNON.Ray：
      一来 cannon 的 Ray 没有 `.update()`（我踩过，直接抛错把 stepSim 打断），
      二来它的字段是 origin/direction 的 cannon 版，copy 不进去。
      既有调用点（updateShells 里的 `new THREE.Raycaster(p0, dirN, 0, dist)`）
      也印证了参数是 Raycaster。 */
const _aimRay = new THREE.Raycaster();
const AIM_FAR = 220;
function screenCenterPoint() {
  const camDir = camForward(new THREE.Vector3());
  const eye = camera.position.clone();
  const far = eye.clone().addScaledVector(camDir, AIM_FAR);
  /* 建筑还没建好的初始化阶段直接给远点，避免 hitBuildings 空跑 */
  if (!buildings.length) return far;
  _aimRay.set(eye, camDir);
  _aimRay.near = 0;
  _aimRay.far = AIM_FAR;
  const hit = hitBuildings(_aimRay, eye, far);
  return (hit && hit.point) ? hit.point.clone() : far;
}
/* 让玩家和炮口一起指向准星方向（纯外观）。
   以前这里把 camYaw 直接当角色朝向，结果按住 W 时角色被"掰"成侧身/背身，
   大炮也随之横在身侧 —— 明明在平射，看起来却像歪的。 */
function faceAimPoint(pt, dt, rate) {
  if (!player.body) return;              // 同 updatePlayer：身体未就绪时直接跳过外观朝向
  const bp = player.body.position;
  const ex = pt.x - bp.x, ez = pt.z - bp.z;
  const ey = pt.y - (bp.y + 0.35);
  const horiz = Math.hypot(ex, ez);
  if (horiz > 0.01) {
    const wantYaw = Math.atan2(ex, ez);
    let dy = wantYaw - player.mesh.rotation.y;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    player.mesh.rotation.y += dy * Math.min(1, rate * dt);
  }
  const wantPitch = Math.atan2(ey, Math.max(0.01, horiz));
  const cg = player.meshParts.cannon;
  let dp = wantPitch - (-cg.rotation.x);
  cg.rotation.y = 0;                       // 大炮与身体同步转，不再单独偏转
  cg.rotation.x += -dp * Math.min(1, rate * dt);
  cg.rotation.x = Math.max(-0.5, Math.min(0.35, cg.rotation.x));
}

function updatePlayer(dt, t) {
  const b = player.body;
  /* ⚠️ 必须防空。player.body 是 buildPlayer() 里才赋值的，而 buildCity/buildPlayer
     被包在 requestAnimationFrame → setTimeout 里（为了让 loading 先画一帧）。
     在那之前的任何一步都可能走到这里：
       · 玩家手快、loading 还没走完就按键；
       · 更常见的是外部驱动（无头验证 / 自动化脚本）一读到 __DBG 就调 tick()。
     不加这道判断，updatePlayer 会抛 TypeError 打断 stepSim，
     而 stepSim 是推进世界的唯一入口 → 整个游戏静默卡死。
     （曾经的现场：路网实例统计全 0、地块数 0，看着像"路网构建失败"，
       实际是构建根本没被执行。） */
  if (!b) return;
  /* 兜底：确保角色永远是醒着的。
     即使某些路径（重置关卡 / 长时间静止）让 body 进入休眠，
     这里也会把它拉回来 —— 否则本帧写入的 velocity 会被物理引擎忽略。 */
  if (b.sleepState !== CANNON.Body.AWAKE || b.type !== CANNON.Body.DYNAMIC) {
    b.type = CANNON.Body.DYNAMIC;
    b.wakeUp();
    b.updateMassProperties();
  }
  const kb = keys;
  let ix = 0, iz = 0;
  if (kb.KeyW || kb.ArrowUp)    iz -= 1;
  if (kb.KeyS || kb.ArrowDown)  iz += 1;
  if (kb.KeyA || kb.ArrowLeft)  ix -= 1;
  if (kb.KeyD || kb.ArrowRight) ix += 1;

  // 把输入转换到世界坐标（相对镜头朝向）
  const fwd = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
  /* ⚠️⚠️ "右"方向这里错过一次，表现为 **A/D 反了**（按 D 往左走）。
     原来的写法是 (cos yaw, 0, -sin yaw) —— 它在数学上确实是
     fwd × up 的结果，但**这是左手系的直觉**；Three.js 是右手系：
     相机看向 +Z（yaw=0）时，屏幕右侧对应的是世界 **-X**。
     实测（yaw=0）：camera.matrixWorld 的右基向量 = (-1, 0, 0)，
     而按 D 玩家位移是 dx=+8 —— 方向整好相反。

     正确的"右" = fwd 绕 Y 轴顺时针 90°，
     即把 (sin y, 0, cos y) 里的 y 换成 y - π/2：
       right = (sin(y-π/2), 0, cos(y-π/2)) = (-cos y, 0, sin y)
     验证 yaw=0：right = (-1, 0, 0) ✓ 与相机右基向量一致。 */
  const right = new THREE.Vector3(-Math.cos(camYaw), 0, Math.sin(camYaw));

  const wish = new THREE.Vector3()
    .addScaledVector(fwd, -iz)
    .addScaledVector(right, ix);
  if (wish.lengthSq() > 0) wish.normalize();

  const sprint = kb.ShiftLeft || kb.ShiftRight;
  const targetSpeed = sprint ? CFG.SPRINT : MAX_SPEED;

  // 水平速度控制：地面响应快，空中保留约 1/3 控制力（有惯性但不"飘"）
  const responsive = player.onGround ? 17 : 5.0;
  const lerpK = Math.min(1, responsive * dt);
  b.velocity.x += (wish.x * targetSpeed - b.velocity.x) * lerpK;
  b.velocity.z += (wish.z * targetSpeed - b.velocity.z) * lerpK;

  if (wish.lengthSq() === 0 && player.onGround) {
    const damp = Math.max(0, 1 - 14 * dt);
    b.velocity.x *= damp;
    b.velocity.z *= damp;
  }

  /* 朝向：始终面向准星方向（不是移动方向）。
     ─ 这是第三人称射击的标准手感：鼠标指哪、人和炮就朝哪，跟按不按 W 无关。
     ─ 于是按住 W 时角色是**正对着楼**笔直往前走，而不是侧身螃蟹步。 */
  faceAimPoint(screenCenterPoint(), dt, 14);

  // 跳跃
  player.jumpCd -= dt;
  if ((kb.Space) && player.onGround && player.jumpCd <= 0) {
    b.velocity.y = CFG.JUMP;
    player.jumpCd = 0.2;
    player.onGround = false;
    Audio.land();
  }
  // 二段跳（空中一次）
  if (kb.Space && !player.onGround && !player._usedAir && player.jumpCd <= 0) {
    if (kb.Space && t - (player._lastJump || 0) > 0.22) {
      b.velocity.y = CFG.JUMP * 0.88;
      player._usedAir = true;
      player.jumpCd = 0.2;
      player._lastJump = t;
      spawnSparks(new THREE.Vector3(b.position.x, b.position.y, b.position.z), 8, 5, 0xaad4ff, 0xffffff);
    }
  }

  /* 地面检测：从角色中心向下短距离探测。
     ⚠️ 这里**不能**设 skipBackfaces:true。
     地面是一个法线朝上的 Plane，而这条射线是向下走的 —— 它打到的正是
     平面的背面。开了 skipBackfaces 会把唯一有效的命中过滤掉，
     结果 onGround 永远为 false（表现为"贴着地面却不停、移动无效"）。 */
  const from = new CANNON.Vec3(b.position.x, b.position.y, b.position.z);
  const to = new CANNON.Vec3(b.position.x, b.position.y - (CFG.PLAYER_R + 0.30), b.position.z);
  const res = new CANNON.RaycastResult();
  const groundRay = new CANNON.Ray();
  groundRay.intersectWorld(world, {
    mode: CANNON.Ray.CLOSEST, from, to,
    collisionFilterGroup: RAY_GROUP, collisionFilterMask: -1,
    result: res,
  });
  const wasAir = !player.onGround;
  player.onGround = res.hasHit;
  if (player.onGround) player._usedAir = false;
  if (player.onGround && wasAir && b.velocity.y < -6) {
    Audio.land();
    spawnDust(new THREE.Vector3(b.position.x, 0.1, b.position.z), 2, 1.0);
  }

  // 边界约束（用城市真实半宽，不是 CFG.CITY * V —— 那是个量纲错误）
  const lim = CITY_HALF + 8;
  b.position.x = Math.max(-lim, Math.min(lim, b.position.x));
  b.position.z = Math.max(-lim, Math.min(lim, b.position.z));

  // 角色可视位置 = 物理位置 - 半径（脚底）
  player.mesh.position.set(b.position.x, b.position.y - CFG.PLAYER_R, b.position.z);

  // 走路动画
  const spd = Math.hypot(b.velocity.x, b.velocity.z);
  const walkK = Math.min(1, spd / 9);
  if (walkK > 0.05) {
    const ph = t * (sprint ? 17 : 12);
    player.meshParts.legs[0].rotation.x = Math.sin(ph) * 0.72 * walkK;
    player.meshParts.legs[1].rotation.x = -Math.sin(ph) * 0.72 * walkK;
    player.mesh.position.y += Math.abs(Math.sin(ph)) * 0.045 * walkK;
  } else {
    player.meshParts.legs[0].rotation.x *= 0.85;
    player.meshParts.legs[1].rotation.x *= 0.85;
  }
  if (!player.onGround) {
    player.meshParts.legs[0].rotation.x = 0.4;
    player.meshParts.legs[1].rotation.x = -0.32;
  }

  // 影子盘
  player.meshParts.disc.position.set(b.position.x, 0.035, b.position.z);
  const h = Math.max(0, b.position.y - CFG.PLAYER_R);
  const k = Math.max(0.12, 1 - h / 22);
  player.meshParts.disc.material.opacity = 0.3 * k;
  player.meshParts.disc.scale.setScalar(1 + h * 0.06);
}

/* 实际开一炮：从炮口朝相机瞄准点发射，带后坐力与音效。
   ⚠️ 抽成独立函数是为了让调试接口（__DBG.fire）走**完全相同的代码路径** ——
   否则验证脚本测的是另一套逻辑，测过了不代表玩家按左键也能打出来。 */
/* ══ 弹道解算 ══════════════════════════════════════════════════════════
   "准星指哪、炮弹落哪"这件事比看上去难，因为有三个点不在一条线上：
     · camera.position  —— 玩家的眼睛，也是准星的**视线原点**
     · muzzlePos        —— 炮口，炮弹实际出生点（玩家胸口偏前上方）
     · 命中点            —— 想让炮弹打到的地方
   相机在玩家**身后上方**（-sinYaw·D·cosPitch, +CAM_HEIGHT, -cosYaw·D·cosPitch，
   D=13、CAM_HEIGHT=2.8），而炮口在玩家身上。于是：

     错误做法（旧版）：aimPoint = camPos + camDir·42，再 shootDir = normalize(aimPoint - muzzle)。
       两个后果：
       1) **射程被砍**。camPos 到 muzzle 有 ~11.5 单位，所以"相机前 42"在炮口看来
          只剩 ~30 单位，远处的楼根本够不到。
       2) **俯仰被摊平**。camPos.y 比 muzzle.y 高 ~4.3，camDir.y=-0.1 时
          aimPoint.y = camPos.y - 4.2 ≈ muzzle.y —— 算出来 shootDir.y ≈ 0，
          炮弹几乎是水平打出去的。再加上 SHELL_GRAVITY=-15 的下坠，
          命中点会比准星低一大截，实测直接扎进地面（y 从 2.0 掉到 0.1）。
      现象就是"开了炮但 0 摧毁"。

   正确做法（下面）分两步：
     ① **先用视线打一条射线**，求出准星真正指向的那个世界点 P。
        从 camera.position 沿 camDir 打，命中建筑就用命中点，否则取远方 220 单位处。
        ——这一步保证了"准星覆盖的地方"与"炮弹想去的地方"一致。
     ② **再解炮口 → P 的抛体仰角**。炮口比视线低，且炮弹受重力，
        所以要把炮口到 P 的位移 (R, Y) 反解成一个带抬升的发射角：
           在速度 s 固定、重力 g 下，打到水平距离 R、高差 Y 需要
             tanθ = (s² ± √(s⁴ − g(gR² + 2Ys²))) / (gR)
           取**低伸弹道**（负根），弹道更平直、更接近准星直觉。
        当根号内为负（目标超出该初速的最大射程）时退化为直射方向。
        ——这一步修掉了"水平打出去、扎进地面"的病根。

   ⚠️ 炮口位置要**先沿视线方向推出**再解算，否则炮口贴在玩家身上时
      R 会被玩家自己挡住（射线起点在体内，第一段就命中自己所在的体素）。 */
function solveShot() {
  const camDir = camForward(new THREE.Vector3());
  const muzzlePos = new THREE.Vector3();
  player.meshParts.glow.getWorldPosition(muzzlePos);

  /* ① 准星命中点：与 HUD 准星、角色朝向共用 screenCenterPoint()，
        保证"看到的""站的方向""打出去的"是同一条线。 */
  const aimPoint = screenCenterPoint();

  /* ② 炮口 → aimPoint 的抛体解算（低伸弹道） */
  const dx = aimPoint.x - muzzlePos.x;
  const dy = aimPoint.y - muzzlePos.y;
  const dz = aimPoint.z - muzzlePos.z;
  const R = Math.hypot(dx, dz);                 // 水平距离
  const g = -CFG.SHELL_GRAVITY;                 // 取正值参与公式
  const s = CFG.SHELL_SPEED;

  let dirV;
  if (R < 0.4) {
    dirV = camDir.clone();                      // 目标几乎就在头顶：直接照视线打
  } else {
    const disc = s * s * s * s - g * (g * R * R + 2 * dy * s * s);
    if (disc >= 0) {
      const tanTheta = (s * s - Math.sqrt(disc)) / (g * R);   // 低伸弹道取负根
      const theta = Math.atan(tanTheta);
      dirV = new THREE.Vector3(dx / R * Math.cos(theta), Math.sin(theta), dz / R * Math.cos(theta));
    } else {
      /* 超出射程：不硬抬仰角，退回"直指目标"，让炮弹自然下坠落到更近处。 */
      dirV = new THREE.Vector3(dx, dy, dz).normalize();
    }
  }
  dirV.normalize();

  /* ③ 炮口沿射击方向前移，避免出生点在角色碰撞体内部 */
  muzzlePos.addScaledVector(dirV, 1.2);
  return { muzzlePos, dirV, aimPoint };
}

function tryShoot() {
  if (!gameRunning) return false;
  const { muzzlePos, dirV: shootDir } = solveShot();
  fireShell(muzzlePos, shootDir, CFG.SHELL_SPEED);
  player.cocd = CFG.COOLDOWN;
  stats.shots++;

  // 后坐力
  player.body.velocity.x -= shootDir.x * 1.5;
  player.body.velocity.z -= shootDir.z * 1.5;

  /* ── 开炮的"手感反馈"四件套 ──
     全部集中在这里，保证玩家按左键和调试接口调用得到完全一致的表现。 */
  addShake(0.55);
  const gl = player.meshParts.glow;
  gl.material.opacity = 1;                       // 炮口闪光
  gl.scale.setScalar(1.9);
  spawnSparks(muzzlePos, 14, 13, 0xfff0a0, 0xff7b2a);
  spawnDust(muzzlePos, 3, 0.8);
  Audio.cannon();
  player.meshParts.cannon.userData.recoil = 0.32;  // 后坐动画
  return true;
}

/* 瞄准 & 开炮 */
function updateAiming(dt) {
  /* 准星方向的唯一权威来源：屏幕中心。
     与 updatePlayer 里的角色朝向共用同一函数，二者不可能对不上。 */
  const aimPt = screenCenterPoint();
  player.aim.copy(camForward(new THREE.Vector3()));

  /* 炮口朝向：这里只做一次"快速贴合"，让停手时炮口也能立刻精确对准；
     持续跟随（含角色转身）由 updatePlayer 里的 faceAimPoint 每帧负责。 */
  faceAimPoint(aimPt, dt, 30);

  // 炮口光晕呼吸
  const gl = player.meshParts.glow;
  gl.material.opacity = Math.max(0, gl.material.opacity - dt * 3.2);
  gl.scale.setScalar(1 + gl.material.opacity * 0.6);

  // 冷却
  player.cocd -= dt;
  if (player.cocd < 0) player.cocd = 0;

  if (mouseDown && player.cocd <= 0) tryShoot();

  /* 后坐动画（每帧衰减，放这里而不是开炮瞬间 —— 它需要 dt） */
  const cg = player.meshParts.cannon;
  if (cg.userData.recoil > 0) {
    cg.userData.recoil = Math.max(0, cg.userData.recoil - dt * 3.4);
    cg.position.z = 0.1 - cg.userData.recoil * 0.42;
  }
}

/* ============================== 第三人称镜头 ============================== */
let camPos = new THREE.Vector3(0, 8, 16);
/* 调试用：置 true 则本帧不更新镜头（截图时固定机位用）。
   故意做成独立变量而不是读 __DBG —— 正常运行不该依赖调试对象。 */
let cameraFreeze = false;
let frameCount = 0, camUpdateCount = 0, camObstructCount = 0;

/* 镜头防穿墙：从角色往镜头方向做一次"体积"检测。
   若有实体方块挡在中间，就把镜头拉到障碍物之前。
   新架构下用网格尺寸算 AABB，并进一步做**逐格实体判定**——
   这样楼被炸掉一块后镜头能"探"进缺口，而不是整栋楼都算障碍。 */
/* 防穿墙探测：从 focus 沿"指向镜头"的方向逐点采样，遇到实体格子就把距离收到它前面。
   这样楼被炸掉一块后镜头能"探"进缺口，而不是整栋楼都算障碍。 */
function cameraObstacleDistance(focus, dirToCam, maxDist) {
  const bldCount = buildings.length;
  if (bldCount === 0) return maxDist;

  /* ⚠️ 采样步长不能写死成 maxDist / CAM_PROBE_N。
     镜头总偏移长度 = |(-sinYaw*D*cosPitch, CAM_H + D*sinPitch, ...)|
     ≈ sqrt(13² + 2.8²) ≈ 13.3，所以在俯仰角较大时相机被抬得很高，
     "从 focus 沿 dirToCam 往外走"这段路程里，**前 5 个采样点全都还在
     人行道上方**（y 只有 2 米左右），根本碰不到楼 ——
     结果就是镜头一路穿墙，钻进楼里看"内脏"。
     改成固定 0.85 单位一格，13.3 的距离上有 16 个采样点，覆盖密得多。 */
  const step = 0.85;
  const MARGIN = 0.55;         // 镜头与障碍之间留的余量
  for (let d = step; d <= maxDist; d += step) {
    const px = focus.x + dirToCam.x * d;
    const py = focus.y + dirToCam.y * d;
    const pz = focus.z + dirToCam.z * d;

    for (let bi = 0; bi < bldCount; bi++) {
      const b = buildings[bi];
      if (b.cells <= 0) continue;
      const x0 = b.wx(0) - V / 2, x1 = b.wx(b.W - 1) + V / 2;
      const z0 = b.wz(0) - V / 2, z1 = b.wz(b.D - 1) + V / 2;
      if (px < x0 || px > x1) continue;
      if (pz < z0 || pz > z1) continue;
      if (py < 0 || py > b.H * V) continue;

      /* AABB 内 → 逐格确认。若该格已被炸掉，镜头可以穿过去（不会被"空气墙"顶住） */
      const gx = Math.round((px - b.originX) / V);
      const gy = Math.round(py / V);
      const gz = Math.round((pz - b.originZ) / V);
      if (gx < 0 || gx >= b.W || gy < 0 || gy >= b.H || gz < 0 || gz >= b.D) continue;
      if (b.grid[b.lidx(gx, gy, gz)] !== 1) continue;

      return Math.max(1.6, d - MARGIN);
    }
  }
  return maxDist;
}

function updateCamera(dt) {
  if (!player.body) return;              // 身体未就绪时不摆镜头（否则同样抛错打断帧）
  const bp = player.body.position;
  const focus = new THREE.Vector3(bp.x, bp.y + 1.15, bp.z);

  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  /* ── 相机位置（相对 focus 的偏移）─────────────────────────────────────
     ⚠️ 这里连踩两个坑，都是"看起来对、实测才知道错"的类型，一并记下：

     坑 1（不跟手）：写成 dirToCam = (-sin(camYaw)cp, CAM_H/CAM_D - sp, -cos(camYaw)cp)。
        那等于说"相机永远在世界的 -X/-Z 一侧"，与 camYaw 只有符号关系，
        所以鼠标左右转、镜头根本不绕圈。改成用 camYaw 的 sin/cos 定水平方位。

     坑 2（钻到脚底下）：为了"拉远时视线同步抬升"，把高度写成 H + D*sin(pitch)。
        可 CAM_DIST=13 而 CAM_HEIGHT 只有 2.8 —— pitch=-0.30 时
        D*sin(pitch) = -3.84，直接把相机拽到 focus **下方 1 米**，
        镜头等于是从地面以下往上看，画面自然全是贴地的。
        正确做法：**高度只由 CAM_HEIGHT 决定，与距离无关**；
        俯仰角只负责让相机"绕到上方/下方"，用 D*sin 会与 H 重复计入。

     现在：
        水平后退 = CAM_DIST*cos(pitch)   （俯仰越大，相机越贴近头顶）
        竖直抬高 = CAM_HEIGHT            （恒定，保证永远在 focus 上方） */
  const offset = new THREE.Vector3(
    -Math.sin(camYaw) * CFG.CAM_DIST * cp,
    CFG.CAM_HEIGHT,
    -Math.cos(camYaw) * CFG.CAM_DIST * cp
  );
  const dirToCam = offset.clone().normalize();

  // 防穿墙：按障碍物把有效距离缩短（沿同一条偏移方向按比例缩）
  const maxDist = offset.length();
  const dist = cameraObstacleDistance(focus, dirToCam, maxDist);
  if (dist < maxDist - 0.05) camObstructCount++;
  offset.multiplyScalar(dist / maxDist);

  const want = new THREE.Vector3(focus.x + offset.x, focus.y + offset.y, focus.z + offset.z);
  want.y = Math.max(0.55, want.y);

  // 平滑跟随：被墙挤近时用更快的插值（避免"糊在墙里"）
  const pushing = dist < maxDist - 0.05;
  const lerpK = 1 - Math.pow(pushing ? 0.0001 : 0.0016, dt);
  camPos.lerp(want, lerpK);
  camera.position.copy(camPos);

  // 震动
  if (camShake > 0) {
    camShake -= dt * 3.2;
    const k = Math.max(0, camShake) * camShakeMag;
    camera.position.x += (Math.random() - .5) * k * 1.5;
    camera.position.y += (Math.random() - .5) * k * 1.5;
    camera.position.z += (Math.random() - .5) * k * 1.5;
    if (camShake <= 0) camShakeMag = 0;
  }

  /* ── 镜头朝向：**沿 camYaw / camPitch 解析出来的轴向前看** ────────────
     ⚠️ 两个都会中招的坑，这里一并记下来：

     坑 1：写 camera.lookAt(focus)，焦点就是玩家。
           相机在玩家"身后 + 上方"，所以"看向玩家"= 向下看！
           实测俯角：pitch=-0.10 时 -16.3°，pitch=-0.30 时 -25.2°。
           而开炮方向取的是 camera.getWorldDirection() —— 于是准星指着楼、
           炮弹却往地上扎。

     坑 2：如果从"已经摆好的相机位置"反推视线方向（focus - camPos），
           只要相机位置那一项是错的（见上面那个符号错误），
           视线就会连带错掉，而且是**物理上无法自洽**的那种错：
           镜头看的方向和它自己相对玩家的位置对不上。
           这一次就是这么翻车的 —— 远处高楼被俯视了约 30°，近处的东西
           却被仰视了约 10°，等于相机"自己斜视自己"。

     所以正确做法是：**先解析出 camYaw / camPitch 对应的方向，
     再让相机看向"自己前方 40 单位处"**（而不是看向玩家）。
     这样取景方向与准星、弹道三者是同一个数，永远不会分家。 */
  const aimDir = camForward(new THREE.Vector3());
  camera.lookAt(
    camera.position.x + aimDir.x * 40,
    camera.position.y + aimDir.y * 40,
    camera.position.z + aimDir.z * 40
  );

  // 轻微 FOV 变化（速度感）
  const spd = Math.hypot(player.body.velocity.x, player.body.velocity.z);
  const wantFov = 62 + Math.min(9, spd * 0.55);
  camera.fov += (wantFov - camera.fov) * Math.min(1, 5 * dt);
  camera.updateProjectionMatrix();
}

/* 出生点解算：站在"最近的楼"的正面、街区内部、面朝该楼。
   ⚠️ 这里的 `yaw` 约定必须与 camForward 一致：
      camForward(yaw) = (sin yaw · cos pitch, sin pitch, cos yaw · cos pitch)
      所以"面朝方向 (dx,dz) 对应的 yaw" = atan2(dx, dz)。
      写成 atan2(dz, dx) 会差 90°（我第一版就是这么错的）。

   ⚠️⚠️ 站位方向也很容易搞反。第一版写的是"站在楼心朝原点退 15 单位"
      —— 那只是在楼和原点之间挪了一点点，落点依旧贴着城市中心，
      实测 24 个方位还是一栋楼都打不到。
      正确的做法是**站到楼的外侧**（沿 原点→楼 的方向再往前走）：
      这样玩家和楼之间没有别的东西，准星正对着它。 */
function spawnPoint() {
  let best = null, bestR = Infinity;
  for (const b of buildings) {
    if (b.cells <= 0) continue;
    const r = b.cx * b.cx + b.cz * b.cz;
    if (r < bestR) { bestR = r; best = b; }
  }
  if (!best) return { x: 0, z: 5, yaw: 0 };
  /* 落点可能正好压到**邻居楼**里（城市很密）。逐圈往外试方位，
     取第一个"不落在任何楼占地内"的站位。 */
  const L = Math.hypot(best.cx, best.cz) || 1;
  const ux = best.cx / L, uz = best.cz / L;      // 原点 → 楼 的单位向量
  const stand = 16;                              // 站位在楼的**外侧**多远
  const insideAny = (x, z) => buildings.some(b => {
    if (b === best || b.cells <= 0) return false;
    const hx = b.W * V * 0.5 + 1.0, hz = b.D * V * 0.5 + 1.0;
    return Math.abs(x - b.cx) < hx && Math.abs(z - b.cz) < hz;
  });
  const base = Math.atan2(ux, uz);
  for (let k = 0; k < 24; k++) {
    /* 先试正外侧，再逐步偏转（±15°、±30°…） */
    const off = (k === 0) ? 0 : ((k % 2 ? 1 : -1) * Math.ceil(k / 2) * Math.PI / 12);
    const a = base + off;
    const x = best.cx + Math.sin(a) * stand;
    const z = best.cz + Math.cos(a) * stand;
    if (!insideAny(x, z)) return { x, z, yaw: Math.atan2(best.cx - x, best.cz - z) };
  }
  /* 全都被占（理论上不会）：退回原点附近，至少保证有落点 */
  return { x: 0, z: 5, yaw: 0 };
}
startBtn.addEventListener('click', startGame);

addEventListener('click', () => {

function resetGame() {
  // 清掉所有碎块
  for (let i = 0; i < FLY_MAX; i++) {
    const d = flyData[i];
    if (d.alive) releaseSlot(d);
  }
  freeSlots.length = 0;
  for (let i = 0; i < FLY_MAX; i++) freeSlots.push(i);
  flyCount = 0;
  collapseTrail = [];        // 清掉"还在倒塌中"的楼（builder 已重建，旧引用会失效）
  collapseDropped = 0;
  simTime = 0;               // 与 flyCount 同步归零：否则重开局后新碎块的 bornAt
                             // 会带着上一局的时间戳，年龄算出来是负数 → 永不过期

  /* ⚠️ 回合计时也必须在这里归零。
     漏掉它的后果非常隐蔽：验证脚本为了把世界推够时间，会调 tick(200)
     （3.3 秒）好几次，累计超过 ROUND_TIME=180 秒 → stepSim 里触发
     endGame() + resetGame() → **城市被整栋重建、stats 清零**。
     表现是探针里连续三炮读到的 destroyed 一模一样（796/796/796）、
     碎块池永远停在同一个数 —— 看起来像"爆炸没生效"，
     实际是每炮之间城市都被换了一套新的。 */
  roundTime = 0;

  // 清掉现有建筑并重建
  disposeCityMeshes();        // chunk mesh 是全城共享的，统一在这里释放
                              // （楼的 meshes 数组在分块合并后恒为空，仅兜底）
  for (const b of buildings) {
    b.meshes.forEach(m => { scene.remove(m); m.dispose(); });
  }
  buildings.length = 0;
  STATIC_VOX_MAT.length = 0;
  totalVoxels = 0;
  buildCity();

  stats.destroyed = 0; stats.score = 0; stats.buildingsRazed = 0;
  stats.shots = 0; stats.best = 0;
  roundTime = 0;
  gameOver = false;
  gameRunning = false;

  // 复位玩家
  /* ⚠️ 出生点不能随便挑。原来写死 `(0, 3, 5)` + `camYaw = 0`，
     而**马路正好沿 x=0 / z=0 铺**，于是玩家站在十字路口正中、
     面朝一条笔直的空街 —— 实测从出生点扫 24 个方位，**一栋楼都打不到**
     （0/24）。第一印象就是"这游戏没东西可打/坏了"。

     改成按城市实际布局算：找离原点最近的那栋楼，
     站在它**正前方偏一点**的位置、面朝它。这样一进游戏准星里就有楼，
     而且不在马路正中（不会被路网"看穿"）。 */
  const sp = spawnPoint();
  player.body.position.set(sp.x, 3, sp.z);
  player.body.velocity.set(0, 0, 0);
  camYaw = sp.yaw;
  /* 初始俯仰 -0.22 —— 实测扫过 dist ∈ {10,12,14,16,20} × pitch ∈ {-0.10…-0.38}
     的网格：站立距离 16 时，pitch 在 -0.16~-0.38 之间准星都落在楼体上，
     且 -0.22 打中的是贴近楼底的位置（y≈3.6，最理想的爆点）。
     原来写 -0.30 会略微朝下，配合更近的站位有落空风险。 */
  camPitch = -0.22;
  camPos.set(sp.x + Math.sin(sp.yaw) * -CFG.CAM_DIST, 8,
             sp.z + Math.cos(sp.yaw) * -CFG.CAM_DIST);

  $('endTitle').textContent = '体素拆迁办';
  overlay.classList.remove('hidden');
  overlay.querySelector('.panel').innerHTML = START_PANEL_HTML;
  const nb = $('startBtn');
  nb.addEventListener('click', startGame);
  refreshHUD();
}

/* 滚轮调镜头 */
addEventListener('wheel', e => {
  CFG.CAM_DIST = Math.max(4.5, Math.min(16, CFG.CAM_DIST + Math.sign(e.deltaY) * 0.75));
}, { passive: true });

/* ============================== 主循环 ============================== */
const clock = new THREE.Clock();
const FIXED_DT = 1 / 60;      // 物理固定步长
let physAcc = 0;              // 物理时间累加器
/* 单帧的"模拟部分"：物理 + 各子系统 + 镜头。
   抽出来是为了让 __DBG.tick(n) 能同步推进 —— headless 软件渲染只有 ~1 FPS，
   "等 800ms 再断言"这种测法每次都读到同一帧，根本测不出东西。
   loop() 和 __DBG.tick 共用这一段，验证的不可能是两套逻辑。 */
function stepSim(dt, t) {
  /* 模拟时间（毫秒）：只随 dt 前进，与挂钟解耦。
     碎块寿命等"按秒计"的逻辑都该用它，而不是 performance.now()。 */
  simTime += dt * 1000;

  if (gameRunning) {
    roundTime += dt;
    if (roundTime >= CFG.ROUND_TIME) endGame();
  }

  /* 物理步进：自己做 accumulator + 固定步长。
     不用 world.step(dt, elapsed, maxSub) 的插值模式 —— 该模式内部有
     `if (performance.now()-t0 > dt*1000) break` 的"掉帧即放弃"逻辑，
     在低端机 / 软件渲染下会导致物理几乎不推进（表现为角色悬空不落地）。
     自己累加则时间永远是向前推进的，掉帧只是变慢，不会卡死。 */
  physAcc += dt;
  let steps = 0;
  while (physAcc >= FIXED_DT && steps < 4) {
    world.step(FIXED_DT);
    physAcc -= FIXED_DT;
    steps++;
  }
  if (steps === 0) world.step(FIXED_DT);   // 高帧率时也保证每帧推进一步
  if (physAcc > FIXED_DT * 6) physAcc = 0; // 长时间挂起后不要"追帧"爆炸

  updatePlayer(dt, t);
  updateAiming(dt);
  updateShells(dt, (point, vel) => explode(point, vel));
  collapsePump();                     // 结构坍塌余波：把还在坠落的楼继续放下一层
  updateDebris(dt);
  updateShocks(dt);
  updateSparks(dt);
  updateDust(dt);
  updateHitmarker(dt);
  /* ⚠️ 这里只认模块内的 cameraFreeze。
     曾经写成 `!window.__DBG || !__DBG.FREEZE` —— 而 __DBG 是在 loop() 启动
     **之后**才赋值的，于是前几帧 !window.__DBG 为真、updateCamera 被整段跳过；
     更糟的是它把"调试开关"和"正常运行"绑在了一起：任何一次顺序调整
     都会让镜头彻底不更新（画面永远是初始那个(0,8,16)的角度）。
     现在用独立的布尔量，运行路径不依赖调试对象是否存在。 */
  if (!cameraFreeze) { camUpdateCount++; updateCamera(dt); }
}

function loop() {
  requestAnimationFrame(loop);
  frameCount++;

  const now = performance.now();
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 0.05);              // 防止切标签页后爆炸
  fpsSmooth += ((1 / Math.max(dt, 0.0001)) - fpsSmooth) * 0.1;

  stepSim(dt, now / 1000);

  // 闪光衰减
  if (flashT > 0) {
    flashT -= dt * 6.5;
    flashEl.style.opacity = String(Math.max(0, flashT) * 0.5);
  } else if (flashEl.style.opacity !== '0') {
    flashEl.style.opacity = '0';
  }

  // 光晕重置
  updateHUD(dt, fpsSmooth);

  /* ── 每帧渲染前的两项性能开关 ──
     1) 阴影相机跟随玩家：只保证玩家视距内有阴影，远处的楼不进 shadow pass。
        位置对齐到体素网格（round），否则 shadow map 随玩家移动会采样闪烁。
     2) chunk 视锥剔除：相机背后的 chunk 整块不画（主 pass 和阴影 pass 都省）。 */
  if (player && player.body) {
    const p = player.body.position;
    const sx = Math.round(p.x / V) * V, sz = Math.round(p.z / V) * V;
    sun.position.set(sx + SUN_DIR.x * 120, SUN_DIR.y * 120, sz + SUN_DIR.z * 120);
    sun.target.position.set(sx, 0, sz);
    sun.target.updateMatrixWorld();
  }
  updateChunkVisibility();

  renderer.render(scene, camera);
}

/* ============================== 启动 ============================== */
const loadEl = $('loading');
const loadText = $('loadText');
loadText.textContent = '正在生成城市…';

// 延一帧让 loading 先渲染出来
requestAnimationFrame(() => {
  setTimeout(() => {
    buildCity();
    buildPlayer();
    loadText.textContent = '准备就绪';
    refreshHUD();
    setTimeout(() => {
      loadEl.classList.add('hidden');
      player.body.position.set(0, 3, 5);
      loop();
    }, 180);
  }, 60);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* 供调试用 */
window.__DBG = {
  scene, world, buildings, flyData, stats, CFG, explode, spawnDebris, camera,
  THREE, CANNON, groundRay: () => new CANNON.Ray(),
  /* ⚠️ detachVoxel 必须暴露：它是"格 → 碎块"的唯一出口，
     验证"摘掉 N 格 ⇔ 生成 N 个碎块"这条不变式时，要能绕开 explode
     逐格调用它，才能把"爆炸逻辑"和"命中收集逻辑"分开单独看。 */
  detachVoxel,
  /* 准星命中点 + 弹道解算，供验证脚本核对"瞄准线==弹道线" */
  screenCenterPoint,
  solveShot,
  /* 结构坍塌：直接调一次（验证脚本用；explode 内部也会调） */
  collapseCheck, collapsePump, supportOf, dropFrom,
  /* 连通性模型（"中间断开 → 上方悬空块掉落"）：
     验证时要能把两个模型**分开**测 —— 单独调 collapseFloating 看它
     摘了多少格，再单独调 supportOf 看承重有没有被误触发。
     混在一起调 collapseCheck 的话，一个模型的工作会被另一个掩盖。 */
  collapseFloating, floatingCells, groundedMask, releaseFloating,
  /* 承重阈值：验证脚本要能读到"判定线"，而不是自己写死 0.55 */
  SUPPORT: () => ({ GROUND_FLOOR, SUPPORT_THRESH, SUPPORT_RATIO, ROUND_CAP: COLLAPSE_ROUND_CAP }),
  /* 派生量：验证脚本要能拿到"实际生效的冲量"，而不是自己再算一遍。
     ⚠️ 这里**没有 K_V** —— 碎块速度压根不随体素尺寸缩放（见文件顶部的
        "质量口径"注释）。把已经删掉的符号写进这个返回对象，会让整个
        consts() 抛 ReferenceError，而 CDP 那侧只会读到一个 "Uncaught"，
        看不到是哪一行 —— 排查一次要花十分钟。 */
  consts: () => ({ V, BLAST_PUSH, COLLAPSE_EXIT, BLAST_R: CFG.BLAST_R }),
  setYaw: (y) => { camYaw = y; },
  setPitch: (p) => { camPitch = p; },
  getYaw: () => camYaw,
  camPitchOf: () => camPitch,
  player,
  fly: flyData,                       // 便于验证脚本统计在场碎块
  /* 模拟时间（秒）。碎块的 bornAt / settleAt 都是这个口径的毫秒值，
     验证"落定后 RESLIDER 秒才淡出"必须能读到它 ——
     否则只能靠 tick 次数反推，而 tick 每次推进的步长是可变的，
     推出的时间会带上累计误差，断言"落地后 2.6 秒还在"就不可靠。 */
  simTime: () => simTime / 1000,

  /* 渲染统计（性能验证用）：draw call / 三角形数 / 可见 chunk 数。
     数值与机器无关，headless 前后对比可信。 */
  rendererInfo: () => ({
    ...renderer.info.render,
    chunksTotal: CHUNKS.length,
    chunksVisible: CHUNKS.filter(c => c.im.visible).length,
    staticVoxels: totalVoxels,
    flyAlive: flyCount,
  }),
  /* 生成期修补了多少个悬空壳格（把它接到地面上）。调试/自检用。 */
  buildRepairs: () => BUILD_REPAIRS,
  shells,                             // 炮弹状态（追踪弹道用）
  hitBuildings,                       // 射线命中测试（单测弹道用）
  /* 触发一次开炮（走和真实点击完全相同的代码路径）
     ⚠️ 返回值要能区分"打出去了"和"被前置条件挡下了"。
        原来无论哪种都 return true，验证脚本看到 true 就以为命中测试通过，
        实际是 gameRunning=false 时 tryShoot 直接 return 了 —— 假通过。 */
  fire: () => {
    if (!gameRunning) return { ok: false, why: 'not_running' };
    if (player.cocd > 0) return { ok: false, why: 'cooldown' };
    try { tryShoot(); return { ok: true, shots: stats.shots }; }
    catch (e) { return { ok: false, why: String(e) }; }
  },

  /* 进入游戏中。startGame 在模块作用域里，外部 eval 够不到，
     所以必须从这里转出去 —— 否则验证脚本永远处于"没开局"状态，
     开炮统计恒为 0。顺带把遮罩藏掉、指针锁跳过（headless 下拿不到锁）。 */
  start: () => {
    if (gameRunning) return { ok: true, already: true };
    try {
      startGame();
      gameRunning = true;
      overlay.classList.add('hidden');
      return { ok: true, gameRunning };
    } catch (e) { return { ok: false, why: String(e) }; }
  },
  setRunning: (v) => { gameRunning = !!v; return gameRunning; },

  /* ── 验证用的隔离原语 ──────────────────────────────────────────────
     ⚠️ 每节测试之间必须能"把世界恢复到一个干净状态"，否则后面的测试会被
        前面的残留污染 —— 这不是理论问题，本次就踩了两次：
          · 池子里还躺着上一节炸出来的 1500+ 块碎块 → 坍塌那轮
            dropFrom 被剩余容量卡住，一格都摘不下来，
            看起来像"坍塌坏了"，实际是碎块池满了。
          · 旧碎块在 9 秒寿命里持续补给 → 生命周期测试的"在场数"
            从 t0 到 t16s 几乎不动，像回收失效。

     clearDebris() —— 立即回收全部碎块（不等寿命自然过期）。
       ⚠️ releaseSlot 自己会 push 回 freeSlots，所以这里**不能**再遍历补一遍，
          否则 freeSlots 里全是重复下标，spawnDebris 的 pop() 会拿到
          已被占用的槽位 —— 表现为"新碎块刚生成就被上一块覆盖"。
       碎块池与 grid 是两套独立状态，所以这个操作安全：
       建筑结构不受影响，可以继续测爆炸/坍塌。

     rebuild() —— 重建整座城市（楼体、材质、统计、碎块池全部归零）。
       代价是几十毫秒，但对"需要一栋从未被碰过的楼"的测试
       （比如负向对照）来说这是唯一可靠的办法 —— 靠 cells/frac
       去"猜哪栋还完好"会被前面任意一节测试推翻。 */
  clearDebris: () => {
    let n = 0;
    for (let i = 0; i < FLY_MAX; i++) if (flyData[i].alive) { releaseSlot(flyData[i]); n++; }
    return n;
  },
  /* ⚠️ rebuild() 会把世界恢复成"未开局"状态（重置面板 + gameRunning=false），
     这在验证脚本里是致命的：后面所有 __DBG.fire() 都会被
     tryShoot 的 `if (!gameRunning) return` 静默挡掉，读数恒为 0，
     看起来像"操作/相机全坏了"，实际只是没回到游戏中。
     这里显式地补一次 start 语义 —— 不调 startGame()（它带 UI 动画和
     requestAnimationFrame 延迟），只做验证需要的那两件事。 */
  rebuild: () => {
    resetGame();
    gameRunning = true;
    gameOver = false;
    overlay.classList.add('hidden');
    return { blds: buildings.length, voxels: totalVoxels, running: gameRunning };
  },

  /* ── 输入注入：验证脚本要用 ─────────────────────────────────────────
     ⚠️ 不要用 dispatchEvent(new KeyboardEvent(...))：脚本里这样发出来的
        事件在部分环境下不会可靠地送达 window 监听器（本次实测就是
        keydown 收不到，位移一直是 0，白折腾一轮）。
        直接从内部改 keys 表，等价于"按键被按住"，而且是确定性的。 */
  key: (code, down) => { keys[code] = !!down; return keys[code]; },
  clearKeys: () => { for (const k in keys) keys[k] = false; },
  keysDump: () => Object.keys(keys).filter(k => keys[k]),

  /* 固定机位（截图 / 上帝视角用）；运行路径不读这个变量 */
  setFreeze: (v) => { cameraFreeze = !!v; return cameraFreeze; },

  /* 运行健康度：帧数 / 镜头更新次数 / 当前镜头内部值。
     排查"镜头不跟手"时，先看这两个计数是否在涨 —— 涨 = 循环在跑，
     再看 camObstruct 是不是把距离压到了下限。 */
  health: () => ({
    frames: frameCount, camUpdates: camUpdateCount, camObstruct: camObstructCount,
    camPos: { x: +camPos.x.toFixed(2), y: +camPos.y.toFixed(2), z: +camPos.z.toFixed(2) },
    cameraPos: { x: +camera.position.x.toFixed(2), y: +camera.position.y.toFixed(2),
                 z: +camera.position.z.toFixed(2) },
    gameRunning, cameraFreeze, roundTime: +roundTime.toFixed(1),
    /* ready：城市与玩家都已经建好、世界真正可推进。
       ⚠️ __DBG 是在模块顶层立刻赋值的，而 buildCity/buildPlayer 要等
       requestAnimationFrame → setTimeout（约 60+180 ms）。两者之间有个窗口，
       外部脚本在这段时间里调 tick() 会推进一个"玩家还没出生"的世界。
       所有断言都应该先等 ready 为 true。 */
    ready: !!player.body && buildings.length > 0,
    /* 体素/建筑规模：改 V 之后最该先看的就是这几个数 ——
       "楼盖出来了但只有 3 格宽"这种问题，看一眼 voxels/bld 就露馅。 */
    voxels: totalVoxels,
    blds: buildings.length,
    flySlots: freeSlots.length,
    collapseDropped, collapseTrail: collapseTrail.length,
    player: player.body ? {
      x: +player.body.position.x.toFixed(2), y: +player.body.position.y.toFixed(2),
      z: +player.body.position.z.toFixed(2)
    } : null,
  }),

  /* ── 确定性推进：软件渲染下 headless 只有 ~1 FPS，任何"等 N 毫秒再看结果"
        的断言都不可靠。这个函数直接同步跑 N 次循环体，让物理与镜头
        按固定步长前进，验证结果就与真实帧率无关了。
        ⚠️ 必须传参进去，不能在内部读 lastT —— 否则第一次 dt 会大到被
           clamp 成 0.05，几步就把角色推到天上去。 */
  tick: (n, step) => {
    /* 未就绪就直接返回，不推进。
       这里必须"静默不动"而不是"尽力推进"：世界还没建好时推了几帧，
       后面所有基于位移/计数的断言都会带上这段无效历史，很难查。 */
    const ready = !!player.body && buildings.length > 0;
    if (!ready) return { frames: frameCount, camUpdates: camUpdateCount, ready: false };
    const dt = step || 1 / 60;
    for (let i = 0; i < (n || 1); i++) stepSim(dt, performance.now() / 1000);
    return { frames: frameCount, camUpdates: camUpdateCount, ready: true };
  },

  /* ── 自检：这台"相机与炮口方向"到底对不对 ────────────────────────────
     起因是炮弹打不到楼，怀疑相机朝向与弹道不一致。
     与其靠人眼争论符号，不如让它自己算一遍、跑一遍、对答案。

     A) dirVsYaw  —— 相机前向量是否等于 yaw 的指向。
        若夹角 ≈ 180°，说明 yaw 与镜头是反向的。

     B) verifyAim() —— 真开一炮，取炮弹当前方向，与相机方向比点积。

     C) projOnScreen() —— 把世界点投影到屏幕，返回归一化坐标。
        0.5/0.5 就是准星中心。用来确认"准星中心 == 弹着点"。 */
  dirVsYaw: () => {
    const d = new THREE.Vector3(); camera.getWorldDirection(d);
    const yawDir = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
    return {
      camDir: { x: +d.x.toFixed(3), y: +d.y.toFixed(3), z: +d.z.toFixed(3) },
      camPos: { x: +camera.position.x.toFixed(2), y: +camera.position.y.toFixed(2),
                z: +camera.position.z.toFixed(2) },
      camYaw: +camYaw.toFixed(4), camPitch: +camPitch.toFixed(4),
      /* 相机水平朝向与 yaw 的夹角（度）：0 = 同向，±180 = 反向 */
      dirVsYawDeg: +(Math.atan2(d.x, d.z) - Math.atan2(yawDir.x, yawDir.z))
        * 180 / Math.PI,
      /* 相机俯角（度）；应当 ≈ camPitch 的度数 */
      camPitchActualDeg: +(Math.asin(d.y) * 180 / Math.PI).toFixed(2),
      camPitchWantDeg: +(camPitch * 180 / Math.PI).toFixed(2),
      pitchErrDeg: +((Math.asin(d.y) - camPitch) * 180 / Math.PI).toFixed(2),
      camDotYaw: +d.dot(yawDir).toFixed(4),
      /* 玩家朝向 vs 镜头朝向（度差）—— 应当 ≈ 0 */
      playerFaceVsCamDeg: +(Math.atan2(Math.sin(player.mesh.rotation.y),
        Math.cos(player.mesh.rotation.y)) - Math.atan2(d.x, d.z)) * 180 / Math.PI,
    };
  },
  projOnScreen: (x, y, z) => {
    const v = new THREE.Vector3(x, y, z).project(camera);
    return { sx: +((v.x + 1) / 2).toFixed(3), sy: +((1 - v.y) / 2).toFixed(3),
             depth: +v.z.toFixed(3), inFront: v.z < 1 };
  },
  /* 真开炮 → 记录弹道方向与相机方向的一致性 */
  verifyAim: () => {
    if (!tryShoot()) return null;
    const d = new THREE.Vector3(); camera.getWorldDirection(d);
    const aim = screenCenterPoint();
    return new Promise(res => {
      const samples = []; let n = 0;
      const step = () => {
        const sh = shells.find(s => s.alive);
        if (sh) samples.push({
          y: +sh.pos.y.toFixed(3),
          dir: { x: +sh.dir.x.toFixed(4), y: +sh.dir.y.toFixed(4), z: +sh.dir.z.toFixed(4) },
          dot: +sh.dir.dot(d).toFixed(4),
        });
        if (++n < 30 && shells.some(s => s.alive)) setTimeout(step, 10);
        else res({
          aimPoint: { x: +aim.x.toFixed(2), y: +aim.y.toFixed(2), z: +aim.z.toFixed(2) },
          camDir: { x: +d.x.toFixed(3), y: +d.y.toFixed(3), z: +d.z.toFixed(3) },
          camPitch: +camPitch.toFixed(4),
          samples: samples.slice(0, 4), sampleCount: samples.length,
        });
      };
      setTimeout(step, 10);
    });
  },
};

};
</script>
